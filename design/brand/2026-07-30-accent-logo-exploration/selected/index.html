<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gian Dragon G final QA</title>
  <link rel="icon" type="image/svg+xml" href="./voice-g-mark.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #101111;
      --paper: #f4f4f1;
      --line: #c9ceca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(90rem, 100%);
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      display: flex;
      gap: 2rem;
      align-items: end;
      justify-content: space-between;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--ink);
    }

    h1,
    h2,
    p { margin: 0; }

    h1 {
      font-size: 2.5rem;
      line-height: 1;
    }

    header p,
    .label {
      color: #626a65;
      font: 700 0.68rem/1.3 "SFMono-Regular", "SF Mono", Menlo, monospace;
      text-transform: uppercase;
    }

    section {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin-bottom: 0.8rem;
      font-size: 1rem;
    }

    .accent-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .sample {
      display: grid;
      gap: 0.4rem;
      justify-items: center;
      min-width: 0;
    }

    .icon {
      --g1: oklch(var(--gL1) calc(var(--c) + 0.04) calc(var(--h) - 46));
      --g2: oklch(var(--gL2) calc(var(--c) + 0.06) calc(var(--h) + 8));
      --g3: oklch(var(--gL3) calc(var(--c) + 0.04) calc(var(--h) + 60));
      position: relative;
      width: 100%;
      max-width: 7.5rem;
      aspect-ratio: 1;
      overflow: hidden;
      background: linear-gradient(115deg, var(--g1), var(--g2) 42%, var(--g3));
      border-radius: 22%;
      box-shadow: 0 0.65rem 1.1rem rgb(16 17 17 / 0.16);
    }

    .mark {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .rose { --h: 5; --c: 0.15; }
    .ember { --h: 35; --c: 0.14; }
    .citron { --h: 95; --c: 0.13; }
    .moss { --h: 150; --c: 0.11; }
    .teal { --h: 195; --c: 0.11; }
    .azure { --h: 230; --c: 0.13; }
    .ink-accent { --h: 270; --c: 0.13; }
    .plum { --h: 320; --c: 0.14; }

    .light { --gL1: 0.66; --gL2: 0.74; --gL3: 0.58; }
    .warm { --gL1: 0.64; --gL2: 0.73; --gL3: 0.56; }
    .dark { --gL1: 0.70; --gL2: 0.80; --gL3: 0.62; }

    .sizes,
    .mono {
      display: flex;
      gap: 1.25rem;
      align-items: end;
    }

    .sizes .icon {
      width: var(--size);
      flex: none;
    }

    .mono .icon {
      width: var(--size);
      background: transparent;
      border-radius: 0;
      box-shadow: none;
    }

    .mono .sample[style*="color:#f4f4f1"] .mark { filter: invert(1); }

    @media (max-width: 48rem) {
      main { padding: 1.25rem; }
      header { display: grid; }
      h1 { font-size: 2rem; }
      .accent-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .accent-grid .sample {
        width: 100%;
        overflow: hidden;
      }
      .accent-grid .icon { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Dragon G / selected</h1>
      <p>Vector master · accent QA · 2026-07-30</p>
    </header>

    <section class="theme light">
      <h2>Light</h2>
      <div class="accent-grid" data-accents></div>
    </section>

    <section class="theme warm">
      <h2>Warm</h2>
      <div class="accent-grid" data-accents></div>
    </section>

    <section class="theme dark">
      <h2>Dark</h2>
      <div class="accent-grid" data-accents></div>
    </section>

    <section class="warm">
      <h2>Favicon scale</h2>
      <div class="sizes">
        <div class="sample"><div class="icon azure" style="--size:64px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">64</span></div>
        <div class="sample"><div class="icon azure" style="--size:32px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">32</span></div>
        <div class="sample"><div class="icon azure" style="--size:16px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">16</span></div>
      </div>
    </section>

    <section>
      <h2>Menu bar / monochrome</h2>
      <div class="mono">
        <div class="sample"><div class="icon" style="--size:32px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">32</span></div>
        <div class="sample"><div class="icon" style="--size:18px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">18</span></div>
        <div class="sample" style="color:#f4f4f1;background:#171817;padding:8px"><div class="icon" style="--size:18px"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label" style="color:inherit">dark</span></div>
      </div>
    </section>
  </main>

  <script>
    const accents = [
      ["rose", "rose"],
      ["ember", "ember"],
      ["citron", "citron"],
      ["moss", "moss"],
      ["teal", "teal"],
      ["azure", "azure"],
      ["ink-accent", "ink"],
      ["plum", "plum"],
    ];

    for (const grid of document.querySelectorAll("[data-accents]")) {
      for (const [className, label] of accents) {
        const sample = document.createElement("div");
        sample.className = "sample";
        sample.innerHTML = `<div class="icon ${className}"><img class="mark" src="./voice-g-mark.svg" alt=""></div><span class="label">${label}</span>`;
        grid.append(sample);
      }
    }
  </script>
</body>
</html>
