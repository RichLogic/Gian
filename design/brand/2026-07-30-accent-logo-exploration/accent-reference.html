<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gian accent gradient reference</title>
  <style>
    :root {
      --gL1: 0.64;
      --gL2: 0.73;
      --gL3: 0.56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      color: #201914;
      background: #f2eee6;
      font-family: "Avenir Next", Avenir, sans-serif;
      letter-spacing: 0;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 28px; color: #766b62; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      max-width: 1100px;
    }
    .accent {
      --g1: oklch(var(--gL1) calc(var(--accent-c) + 0.04) calc(var(--accent-h) - 46));
      --g2: oklch(var(--gL2) calc(var(--accent-c) + 0.06) calc(var(--accent-h) + 8));
      --g3: oklch(var(--gL3) calc(var(--accent-c) + 0.04) calc(var(--accent-h) + 60));
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    .rose { --accent-h: 5; --accent-c: 0.15; }
    .ember { --accent-h: 35; --accent-c: 0.14; }
    .citron { --accent-h: 95; --accent-c: 0.13; }
    .moss { --accent-h: 150; --accent-c: 0.11; }
    .teal { --accent-h: 195; --accent-c: 0.11; }
    .azure { --accent-h: 230; --accent-c: 0.13; }
    .ink { --accent-h: 270; --accent-c: 0.13; }
    .plum { --accent-h: 320; --accent-c: 0.14; }
    .tile {
      display: grid;
      width: 210px;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(115deg, var(--g1), var(--g2) 42%, var(--g3) 78%, var(--g1));
      border-radius: 46px;
      box-shadow: 0 16px 34px rgb(54 38 26 / 0.18);
    }
    svg { width: 78%; height: 78%; }
    span {
      font-family: "SFMono-Regular", "SF Mono", Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    @media (max-width: 800px) {
      body { padding: 20px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile { width: min(40vw, 210px); }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="current-g" viewBox="0 0 64 64">
        <path fill="#101111" d="M32 6C18 6 7 16 7 32s11 26 25 26c10 0 18-5 22-12V30H35v9h9c-3 6-7 9-12 9-9 0-15-7-15-16s6-16 15-16c4 0 7 1 10 3l7-8c-6-4-11-5-17-5Z"/>
        <ellipse fill="#f9f8f3" cx="25" cy="24" rx="3.6" ry="3.2"/>
        <circle fill="#101111" cx="26" cy="24.5" r="1.7"/>
        <path fill="#f9f8f3" d="m21 18.8 8 2-.4 1.6-8-2Z"/>
      </symbol>
    </defs>
  </svg>

  <h1>Exact Gian status gradients</h1>
  <p>Warm-theme gL values, current G used only as a contrast reference.</p>
  <main class="grid">
    <div class="accent rose"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>rose</span></div>
    <div class="accent ember"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>ember</span></div>
    <div class="accent citron"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>citron</span></div>
    <div class="accent moss"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>moss</span></div>
    <div class="accent teal"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>teal</span></div>
    <div class="accent azure"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>azure</span></div>
    <div class="accent ink"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>ink</span></div>
    <div class="accent plum"><div class="tile"><svg viewBox="0 0 64 64"><use href="#current-g"/></svg></div><span>plum</span></div>
  </main>
</body>
</html>
