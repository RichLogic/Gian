<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Gian — IDE for remote coding agents</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="tokens.css?v=28"/>
<link rel="stylesheet" href="shell.css?v=28"/>
<link rel="stylesheet" href="components.css?v=28"/>
<link rel="stylesheet" href="coding.css?v=28"/>
<link rel="stylesheet" href="other-views.css?v=28"/>
<link rel="stylesheet" href="events.css?v=28"/>
<link rel="stylesheet" href="tweaks.css?v=28"/>
</head>
<body data-theme="warm" data-accent="plum" data-density="cozy">

<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <a class="brand" href="#" onclick="event.preventDefault()">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none"><path d="M5 4h14M5 12h14M5 20h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="19" cy="20" r="2" fill="currentColor"/></svg>
      <span class="brand-word">Gian</span>
    </a>

    <button class="runner-chip" onclick="App.togglePopover('runner', event)">
      <span class="runner-dot"></span>
      <span class="runner-host">mbp-16</span>
      <span class="runner-sep">·</span>
      <span>12ms</span>
      <svg class="runner-caret" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="crumbs">
      <span class="crumb-lbl">Workspace:</span>
      <span class="crumb">remote-vibe-coding</span>
    </div>

    <span class="topbar-spacer"></span>

    <button class="top-cmd" title="Command palette (⌘K)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Jump to session, file, command…</span>
      <kbd class="kc">⌘K</kbd>
    </button>

    <button class="inbox-btn" onclick="App.togglePopover('inbox', event)" title="Pending approvals">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 9l2-5h8l2 5M2 9v4h12V9M2 9h4l1 2h2l1-2h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="inbox-count" id="inbox-count">2</span>
    </button>

    <button class="avatar" onclick="App.openSettings()" title="Settings">R</button>
  </header>

  <!-- BODY: nav + stage -->
  <div class="body">
    <nav class="nav">
      <button class="nav-btn active" data-view="coding" onclick="App.switchView('coding')" title="Coding">
        <svg viewBox="0 0 16 16" fill="none"><path d="M5 5L2 8l3 3M11 5l3 3-3 3M9 3l-2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Coding</span>
        <span class="nav-badge" id="nav-badge-coding">2</span>
      </button>
      <button class="nav-btn" data-view="files" onclick="App.switchView('files')" title="Files">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 4a1 1 0 011-1h3l2 2h5a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>Files</span>
      </button>
      <div class="nav-rule"></div>
      <button class="nav-btn" data-view="workspaces" onclick="App.switchView('workspaces')" title="Workspaces">
        <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Spaces</span>
      </button>
      <button class="nav-btn" data-view="bots" onclick="App.switchView('bots')" title="Bots">
        <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="5" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="9" r="1" fill="currentColor"/><circle cx="10" cy="9" r="1" fill="currentColor"/><path d="M8 3v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Bots</span>
      </button>
      </button>
    </nav>

    <!-- STAGE -->
    <main class="stage" id="stage"></main>
  </div>

</div>

<!-- Settings sheet -->
<div class="sheet-overlay" id="sheet" onclick="if(event.target===this)App.closeSettings()">
  <aside class="sheet" id="sheet-body"></aside>
</div>

<!-- Popovers -->
<div class="popover" id="pop" style="display:none;"></div>

<!-- Toasts -->
<div class="toasts" id="toasts"></div>

<!-- Tweaks -->
<aside class="tweaks" id="tweaks" style="display:none;">
  <div class="tweaks-head">
    <span>Tweaks</span>
    <button class="btn ghost sm icon" onclick="App.hideTweaks()"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="tweaks-body">
    <div class="tweaks-row">
      <span class="tweaks-lbl">Theme</span>
      <div class="segm">
        <button class="segm-item" onclick="App.setTheme('light')" data-theme-btn="light">Light</button>
        <button class="segm-item active" onclick="App.setTheme('warm')" data-theme-btn="warm">Warm</button>
        <button class="segm-item" onclick="App.setTheme('dark')" data-theme-btn="dark">Dark</button>
      </div>
    </div>
    <div class="tweaks-row">
      <span class="tweaks-lbl">Accent</span>
      <div class="accent-picker">
        <button class="accent-swatch active" style="background:oklch(0.55 0.13 310);" data-accent-btn="plum" onclick="App.setAccent('plum')"></button>
        <button class="accent-swatch" style="background:oklch(0.58 0.10 150);" data-accent-btn="moss" onclick="App.setAccent('moss')"></button>
        <button class="accent-swatch" style="background:oklch(0.55 0.11 255);" data-accent-btn="ink" onclick="App.setAccent('ink')"></button>
        <button class="accent-swatch" style="background:oklch(0.62 0.13 30);" data-accent-btn="ember" onclick="App.setAccent('ember')"></button>
      </div>
    </div>
    <div class="tweaks-row">
      <span class="tweaks-lbl">Density</span>
      <div class="segm">
        <button class="segm-item" data-density-btn="compact" onclick="App.setDensity('compact')">Compact</button>
        <button class="segm-item active" data-density-btn="cozy" onclick="App.setDensity('cozy')">Cozy</button>
        <button class="segm-item" data-density-btn="roomy" onclick="App.setDensity('roomy')">Roomy</button>
      </div>
    </div>
    <div class="tweaks-row">
      <span class="tweaks-lbl">View</span>
      <div class="segm">
        <button class="segm-item active" onclick="App.switchView('coding')">Coding</button>
        <button class="segm-item" onclick="App.switchView('new')">New</button>
        <button class="segm-item" onclick="App.switchView('files')">Files</button>
      </div>
      <div class="segm" style="margin-top:4px;">
        <button class="segm-item" onclick="App.switchView('workspaces')">Spaces</button>
        <button class="segm-item" onclick="App.switchView('bots')">Bots</button>
      </div>
    </div>
  </div>
</aside>

<script id="editmode-config">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "warm",
  "accent": "ember",
  "density": "cozy",
  "view": "coding"
}/*EDITMODE-END*/;
</script>

<script src="data.js?v=28"></script>
<script src="views.js?v=28"></script>
<script src="views-other.js?v=28"></script>
<script>
// ============================================================
// App controller
// ============================================================
const App = {
  state: { view: 'coding', sessionId: 's1', theme: 'warm', accent: 'plum', density: 'cozy', previewOpen: false, inspectorFile: null, recording: false, grantsSession: 's1' },

  init() {
    // Restore
    const saved = JSON.parse(localStorage.getItem('gian') || '{}');
    Object.assign(this.state, TWEAK_DEFAULTS, saved);
    this.setTheme(this.state.theme, true);
    this.setAccent(this.state.accent, true);
    this.setDensity(this.state.density, true);
    this.switchView(this.state.view || 'coding', true);

    // Keyboard
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { this.closeSettings(); this.closePopover(); }
    });
    // Close popover on outside click
    document.addEventListener('click', (e) => {
      const pop = document.getElementById('pop');
      if (pop.style.display === 'block' && !pop.contains(e.target) && !e.target.closest('[onclick*="togglePopover"], [onclick*="openSlash"], [onclick*="openSessionMenu"], [onclick*="openInbox"], [onclick*="openRunner"], [onclick*="openSessionGrants"], [onclick*="openModelPicker"]')) {
        this.closePopover();
      }
    });

    // Edit-mode host protocol
    window.addEventListener('message', (ev) => {
      const m = ev.data || {};
      if (m.type === '__activate_edit_mode') this.showTweaks();
      if (m.type === '__deactivate_edit_mode') this.hideTweaks();
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  },

  persist() {
    localStorage.setItem('gian', JSON.stringify(this.state));
  },

  switchView(v, skipSave) {
    this.state.view = v;
    const stage = document.getElementById('stage');
    const fn = Views[v] || Views.coding;
    stage.innerHTML = v === 'coding' ? fn(this.state.sessionId) : fn();
    // Highlight nav
    document.querySelectorAll('.nav-btn[data-view]').forEach(n => n.classList.toggle('active', n.dataset.view === v || (v === 'new' && n.dataset.view === 'coding')));
    const crumb = document.getElementById('crumb-view');
    if (crumb) {
      const labels = { coding: 'Coding', new: 'New session', files: 'Files', workspaces: 'Spaces', bots: 'Bots' };
      crumb.textContent = labels[v] || v;
    }
    if (!skipSave) {
      this.persist();
      this._persistTweak({ view: v });
    }
  },

  selectSession(id) {
    this.state.sessionId = id;
    this.switchView('coding');
  },

  setFilesTab(tab) {
    this.state.filesTab = tab;
    if (this.state.view === 'files') this.switchView('files', true);
  },

  togglePreview() {
    const p = document.getElementById('preview');
    if (!p) return;
    p.classList.toggle('open');
    this.state.previewOpen = p.classList.contains('open');
  },

  openPreview(name) {
    const p = document.getElementById('preview');
    if (p) p.classList.add('open');
    this.state.previewOpen = true;
    this.toast('Opened ' + name + ' in preview');
  },

  togglePopover(kind, ev) {
    ev.stopPropagation();
    const pop = document.getElementById('pop');
    if (pop.style.display === 'block' && pop.dataset.kind === kind) {
      this.closePopover();
      return;
    }
    pop.dataset.kind = kind;
    pop.innerHTML = Views[kind]();
    pop.style.display = 'block';
    // Position relative to the trigger — pick the anchor side that
    // keeps the popover fully on-screen
    const rect = ev.currentTarget.getBoundingClientRect();
    const popH = pop.offsetHeight;
    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow >= popH + 12 || rect.top < popH + 12) {
      // place below
      pop.style.top = (rect.bottom + 6) + 'px';
      pop.style.bottom = 'auto';
    } else {
      // place above
      pop.style.top = 'auto';
      pop.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    }
    const triggerCenter = (rect.left + rect.right) / 2;
    if (triggerCenter < window.innerWidth / 2) {
      pop.style.left = Math.max(8, rect.left) + 'px';
      pop.style.right = 'auto';
    } else {
      pop.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
      pop.style.left = 'auto';
    }
  },
  closePopover() {
    const pop = document.getElementById('pop');
    pop.style.display = 'none';
    pop.classList.remove('slash-pop');
    pop.style.transform = '';
    pop.style.bottom = 'auto';
  },
  closeInbox() { this.closePopover(); },

  openSettings() {
    const sh = document.getElementById('sheet');
    document.getElementById('sheet-body').innerHTML = Views.settings();
    sh.classList.add('open');
  },
  closeSettings() { document.getElementById('sheet').classList.remove('open'); },

  approve(id, mode) {
    const labels = { once: 'Allowed once · running', session: 'Allowed for session · running', deny: 'Declined · command not run' };
    this.toast(labels[mode]);
    // Find the pending approval card and morph it in place to a resolved card
    const card = document.querySelector(`.approval[data-approval="${id}"]`);
    if (card) {
      card.classList.remove('high');
      card.classList.add(mode === 'deny' ? 'declined' : 'resolved');
      const ico = card.querySelector('.approval-ico');
      if (ico) ico.innerHTML = mode === 'deny'
        ? '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
        : '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const risk = card.querySelector('.approval-risk');
      if (risk) risk.textContent = mode === 'deny' ? 'declined' : 'approved';
      const actions = card.querySelector('.approval-actions');
      if (actions) actions.outerHTML = `<div class="approval-resolved-note"><span class="dot"></span><span>${labels[mode]} · by <strong>web</strong></span></div>`;
    }
    // Remove ticker, decrement counters
    const ticker = document.querySelector('.transcript .ticker');
    if (ticker) ticker.closest('.msg')?.remove();
    const badge = document.getElementById('nav-badge-coding');
    const inbox = document.getElementById('inbox-count');
    if (badge) { const n = Math.max(0, parseInt(badge.textContent)-1); badge.textContent = n; if (!n) badge.style.display='none'; }
    if (inbox) { const n = Math.max(0, parseInt(inbox.textContent)-1); inbox.textContent = n; if (!n) inbox.style.display='none'; }
  },

  setMode(sid, mode) {
    const s = window.GIAN_DATA.sessions.find(x => x.id === sid);
    if (s) {
      s.approval_mode = mode;
      if (mode === 'auto' && !s.approval_turns) s.approval_turns = 5;
    }
    const labels = {
      'default': 'Default · single turn, you confirm risky actions',
      'auto':    'Auto · multi-turn job, auto-approve safe actions',
    };
    this.toast(labels[mode] || mode);
    if (this.state.view === 'coding') this.switchView('coding', true);
  },

  adjTurns(sid, delta) {
    const s = window.GIAN_DATA.sessions.find(x => x.id === sid);
    if (!s) return;
    const cur = s.approval_turns || 1;
    s.approval_turns = Math.max(1, Math.min(50, cur + delta));
    if (this.state.view === 'coding') this.switchView('coding', true);
  },

  stopJob(sid) {
    this.toast('Job stopped');
    const bar = document.querySelector('.job-bar');
    if (bar) { bar.style.opacity = '0.5'; bar.style.pointerEvents = 'none'; }
  },

  takeoverWeb(sid) {
    const s = window.GIAN_DATA.sessions.find(x => x.id === sid);
    if (s) s.active_channel = 'web';
    this.switchView('coding');
    this.toast('Web took over · IM is now read-only');
  },

  openInspector(path, line) {
    this.state.inspectorFile = path;
    this.state.previewOpen = true;
    // Re-render coding to show inspector
    if (this.state.view === 'coding') this.switchView('coding');
    this.toast('Inspector', path + (line ? ':' + line : ''));
  },

  openSessionGrants(sid) {
    this.state.grantsSession = sid;
    const trigger = document.querySelector('.grants-link') || document.querySelector('.tok-strip') || document.body;
    this.togglePopover('grants', { stopPropagation: () => {}, currentTarget: trigger });
  },

  openModelPicker(ev, sid) {
    this.state.modelSession = sid;
    this.togglePopover('modelPicker', ev);
  },
  setModel(sid, model) {
    const s = window.GIAN_DATA.sessions.find(x => x.id === sid);
    if (s) s.model = model;
    this.toast('Model set', model);
    // Re-render the popover so the check moves; keep it open
    document.getElementById('pop').innerHTML = Views.modelPicker();
    // Update composer button without full re-render
    const btn = document.querySelector('.composer-opt .cmp-model');
    if (btn) btn.textContent = model;
  },
  setThinking(sid, level) {
    const s = window.GIAN_DATA.sessions.find(x => x.id === sid);
    if (s) s.thinking = level;
    this.toast('Thinking effort', level);
    document.getElementById('pop').innerHTML = Views.modelPicker();
    if (this.state.view === 'coding') this.switchView('coding', true);
  },

  voiceStart() {
    this.state.recording = true;
    const b = document.getElementById('voice-btn');
    if (b) b.classList.add('recording');
  },
  voiceEnd() {
    if (!this.state.recording) return;
    this.state.recording = false;
    const b = document.getElementById('voice-btn');
    if (b) b.classList.remove('recording');
    // Simulate transcription back into composer
    const ta = document.querySelector('.composer-ta');
    if (ta) {
      const sample = 'Also add session token refresh — auto-renew 5 min before expiry.';
      ta.value = (ta.value ? ta.value + ' ' : '') + sample;
      ta.focus();
    }
    this.toast('Voice transcribed', 'Edit before sending');
  },

  pickExec(el, name) {
    el.parentElement.querySelectorAll('.exec-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  },

  toast(title, desc) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<svg class="toast-ico" viewBox="0 0 16 16"><path d="M3 8l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><div class="toast-title">${title}</div>${desc?`<div class="toast-desc">${desc}</div>`:''}</div>`;
    const c = document.getElementById('toasts');
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-6px)'; }, 2600);
    setTimeout(() => t.remove(), 3000);
  },

  setTheme(name, skipSave) {
    this.state.theme = name;
    document.body.dataset.theme = name;
    document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.toggle('active', b.dataset.themeBtn === name));
    document.querySelectorAll('.theme-chip').forEach(b => b.classList.toggle('active', b.dataset.theme === name));
    if (!skipSave) { this.persist(); this._persistTweak({ theme: name }); }
  },
  setAccent(name, skipSave) {
    this.state.accent = name;
    document.body.dataset.accent = name;
    document.querySelectorAll('[data-accent-btn], .accent-swatch').forEach(b => {
      const n = b.dataset.accentBtn || b.getAttribute('onclick')?.match(/setAccent\('(\w+)'/)?.[1];
      b.classList.toggle('active', n === name);
    });
    if (!skipSave) { this.persist(); this._persistTweak({ accent: name }); }
  },
  setDensity(name, skipSave) {
    this.state.density = name;
    document.body.dataset.density = name;
    document.querySelectorAll('[data-density-btn]').forEach(b => b.classList.toggle('active', b.dataset.densityBtn === name));
    if (!skipSave) { this.persist(); this._persistTweak({ density: name }); }
  },

  showTweaks() { document.getElementById('tweaks').style.display = 'block'; },
  hideTweaks() { document.getElementById('tweaks').style.display = 'none'; },

  // ---- Slash command palette ----
  openSlash(ev, sid) {
    ev.stopPropagation();
    const pop = document.getElementById('pop');
    pop.dataset.kind = 'slash';
    pop.innerHTML = Views.slash(sid);
    pop.style.display = 'block';
    pop.classList.add('slash-pop');
    const rect = ev.currentTarget.getBoundingClientRect();
    pop.style.top = (rect.top - 8) + 'px';
    // anchor right edge of popover to right edge of slash button so it
    // never overflows the viewport on small windows
    const desiredRight = rect.right;
    const popW = 460;
    pop.style.left = Math.max(12, desiredRight - popW) + 'px';
    pop.style.right = 'auto';
    pop.style.transform = 'translateY(-100%)';
  },
  pickSlash(cmd) {
    const ta = document.querySelector('.composer-ta');
    if (ta) { ta.value = cmd + ' '; ta.focus(); }
    this.closePopover();
  },
  composerInput(e) {
    const v = e.target.value;
    if (v === '/' && !document.querySelector('.popover.slash-pop[style*="block"]')) {
      // synthesise an event near the slash button
      const sb = document.querySelector('.slash-btn');
      if (sb) this.openSlash({ stopPropagation:()=>{}, currentTarget: sb }, this.state.sessionId);
    }
  },

  // ---- Per-session menu (Reset, Fork, Export, Archive) ----
  openSessionMenu(ev, sid) {
    ev.stopPropagation();
    const pop = document.getElementById('pop');
    pop.dataset.kind = 'sessmenu';
    pop.innerHTML = Views.sessionMenu(sid);
    pop.style.display = 'block';
    pop.classList.remove('slash-pop');
    const rect = ev.currentTarget.getBoundingClientRect();
    pop.style.top = (rect.top - 8) + 'px';
    pop.style.left = Math.max(12, rect.right - 220) + 'px';
    pop.style.right = 'auto';
    pop.style.transform = 'translateY(-100%)';
  },
  resetSession(sid) {
    this.toast('Session reset', 'Context cleared · transcript kept');
    this.closePopover();
  },

  // ---- Inspector diff toggle ----
  toggleDiff() {
    this.state.diffView = !this.state.diffView;
    if (this.state.view === 'coding') this.switchView('coding');
  },

  _persistTweak(edits) {
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*'); } catch {}
  },
};
App.init();
</script>

</body>
</html>
