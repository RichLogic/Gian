  padding-right: 2px;
  text-align: right;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}
.files-fchip > select:focus { outline: none; }
.files-fchip > .rfc-car {
  flex-shrink: 0;
  color: var(--text-3);
  font-size: 10px;
  pointer-events: none;
}

/* Files — expandable tree (mirrors design/other-views.css .tree) */
.tree {
  padding: 4px 2px;
  font-family: var(--font-mono);
  font-size: var(--fz-11);
}
.tree-item {
  display: grid;
  grid-template-columns: 12px 14px 1fr auto;
  gap: 5px;
  align-items: center;
  padding: 3px 6px;
  border-radius: var(--r-1);
  cursor: pointer;
  color: var(--text-2);
  user-select: none;
}
.tree-item:hover { background: var(--surface-2); }
.tree-item.active {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.tree-item.folder .tree-name { color: var(--text); font-weight: 500; }
.tree-item .tree-caret {
  color: var(--text-3);
  font-size: 9px;
  transition: transform 120ms var(--ease);
  display: inline-block;
}
.tree-item.open .tree-caret { transform: rotate(90deg); }
.tree-item .tree-ico {
  width: 14px; height: 14px;
  color: var(--text-3);
  flex-shrink: 0;
}
.tree-item.folder .tree-ico { color: var(--accent-text); opacity: 0.7; }
.tree-item.active .tree-ico { color: var(--accent-text); }
.tree-item .tree-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-children { padding-left: 14px; }

.files-mode-toggle {
  display: flex;
  gap: 18px;
  padding: 0 12px;
  border-bottom: 1px solid var(--hairline);
}
.files-mode-btn {
  position: relative;
  padding: 8px 2px 9px;
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text-3);
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: color 80ms var(--ease);
}
.files-mode-btn:hover { color: var(--text-2); }
.files-mode-btn.active {
  color: var(--accent-text);
  font-weight: 600;
}
.files-mode-btn.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
}

.files-badge {
  flex-shrink: 0;
  width: 16px; height: 16px;
  border-radius: var(--r-1);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  text-transform: uppercase;
}
.files-badge-add { background: oklch(from var(--ok) l c h / 0.15); color: var(--ok); }
.files-badge-mod { background: oklch(from var(--warn, #f0a500) l c h / 0.15); color: var(--warn, #f0a500); }
.files-badge-del { background: oklch(from var(--danger) l c h / 0.15); color: var(--danger); }

/* Files preview empty state — friendlier than a single line of grey text */
.files-preview-empty {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding: 40px 24px;
  color: var(--text-3);
  text-align: center;
}
.files-preview-empty .fpe-icon {
  width: 56px; height: 56px;
  color: var(--text-3);
  opacity: 0.6;
}
.files-preview-empty .fpe-title {
  margin: 0;
  font-size: var(--fz-13);
  color: var(--text-2);
}
.files-preview-empty .fpe-hint {
  margin: 0;
  font-size: var(--fz-12);
  color: var(--text-3);
  display: inline-flex; align-items: center; gap: 6px;
}
.files-preview-empty .fpe-hint kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 1px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--r-1);
  background: var(--surface-2);
  color: var(--text-2);
}

/* Changed-files summary header — sticky-ish row with totals */
.files-changed-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px 8px 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-3);
  border-bottom: 1px solid var(--hairline);
  background: var(--surface-2);
}
.files-changed-summary .fcs-count { color: var(--text-2); }
.files-changed-summary .fcs-add { color: var(--ok); margin-left: auto; }
.files-changed-summary .fcs-del { color: var(--warn); }

/* Changed-file row — single line, grid columns: badge | path | stats */
.files-changed-row {
  display: grid;
  grid-template-columns: 18px 1fr max-content;
  align-items: center;
  column-gap: 8px;
  padding: 5px 10px 5px 12px;
  border: 0;
  background: transparent;
  border-radius: var(--r-1);
  cursor: pointer;
  text-align: left;
  width: 100%;
  margin: 0;
}
.files-changed-row:hover { background: var(--surface-2); }
.files-changed-row.active { background: var(--accent-soft); }
.files-changed-row .fcr-path {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;       /* keep the file name visible when path is long */
  text-align: left;
}
.files-changed-row.active .fcr-path { color: var(--accent-text); }
.files-changed-row .fcr-stat {
  display: inline-flex;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.files-changed-row .fcr-stat .add { color: var(--ok); }
.files-changed-row .fcr-stat .del { color: var(--warn); }

.files-stat {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.files-stat .add { color: var(--ok); }
.files-stat .del { color: var(--danger); }

.files-pane-toggle {
  display: inline-flex;
  margin-left: 10px;
  gap: 0;
}
.files-pane-btn {
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-3);
  background: transparent;
  border: 1px solid var(--hairline);
  cursor: pointer;
  transition: all 80ms var(--ease);
}
.files-pane-btn:first-child { border-radius: var(--r-1) 0 0 var(--r-1); }
.files-pane-btn:last-child  { border-radius: 0 var(--r-1) var(--r-1) 0; }
.files-pane-btn.active {
  color: var(--accent-text);
  background: var(--accent-soft);
  border-color: var(--accent-ring);
}

.files-hunk-header {
  padding: 3px 10px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  white-space: pre;
}
.files-diff-ln {
  display: flex;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.6;
  padding: 0 10px;
}
.files-diff-ln.add { background: oklch(from var(--ok) l c h / 0.08); }
.files-diff-ln.del { background: oklch(from var(--danger) l c h / 0.08); }
.files-diff-sig {
  flex-shrink: 0;
  width: 14px;
  color: var(--text-3);
  user-select: none;
}
.files-diff-ln.add .files-diff-sig { color: var(--ok); }
.files-diff-ln.del .files-diff-sig { color: var(--danger); }
.files-diff-txt {
  flex: 1;
  white-space: pre;
  color: var(--text);
}

/* ============================================================
   Settings sheet — slide-over from right (matches design spec)
   ============================================================ */
.settings-overlay {
  position: fixed; inset: 0;
  background: oklch(0 0 0 / 0.32);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: stretch; justify-content: flex-end;
  padding: var(--gutter);
  z-index: 70;
  animation: settings-overlay-in 180ms var(--ease);
}
@keyframes settings-overlay-in { from { opacity: 0; } to { opacity: 1; } }

.settings-panel {
  width: 420px;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: settings-panel-in 220ms var(--ease);
}
@keyframes settings-panel-in {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: none; }
}

.settings-panel .sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 30px;
  display: flex; flex-direction: column; gap: 16px;
}

/* Sheet primitives */
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 4px;
}
.sheet-title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--text);
}
.sheet-section {
  display: flex; flex-direction: column; gap: 8px;
  flex-shrink: 0;
}
.sheet-section + .sheet-section {
  padding-top: 14px;
  border-top: 1px solid var(--hairline);
}
.sheet-lbl {
  font-size: var(--fz-11); font-weight: 600;
  color: var(--text-2);
  font-family: var(--font-mono);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* 2-column field grid */
.kv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* Account card */
.account-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  background: var(--surface-2);
  border-radius: var(--r-2);
}
.account-av {
  width: 32px; height: 32px;
  border-radius: var(--r-2);
  background: var(--accent);
  color: var(--text-inv);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
}
.account-body { flex: 1; min-width: 0; }
.account-name { font-size: var(--fz-12); font-weight: 600; }
.account-role {
  font-size: var(--fz-11);
  color: var(--text-3);
  font-family: var(--font-mono);
}

/* Theme picker — chip with mini swatch */
.theme-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.theme-chip {
  padding: 10px 8px;
  border-radius: var(--r-2);
  background: var(--surface-2);
  font-size: var(--fz-11);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
  border: none;
  color: var(--text);
}
.theme-chip:hover { background: var(--surface-3); }
.theme-chip.active { box-shadow: 0 0 0 2px var(--accent-ring); }
.theme-swatch {
  width: 100%; height: 36px;
  border-radius: var(--r-1);
  display: flex; overflow: hidden;
}
.theme-swatch i { flex: 1; height: 100%; display: block; }

/* Accent picker — round colored swatches */
.accent-picker { display: flex; gap: 6px; }
.accent-swatch {
  width: 26px; height: 26px;
  border-radius: var(--r-2);
  position: relative;
  cursor: pointer;
  border: none;
  padding: 0;
}
.accent-swatch.active::after {
  content: "";
  position: absolute; inset: -3px;
  border-radius: var(--r-2);
  box-shadow: 0 0 0 2px var(--accent-ring);
}

/* Inputs / selects in the panel get an explicit border */
.settings-panel .input,
.settings-panel .select {
  border: 1px solid var(--border);
  background: var(--surface);
}
.settings-panel .input:focus,
.settings-panel .select:focus {
  border-color: var(--accent);
}
.settings-panel .input[disabled],
.settings-panel .select[disabled] {
  background: var(--surface-inset);
  color: var(--text-3);
  cursor: not-allowed;
}

/* Saved indicator (small, near close button) */
.sheet-saved {
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  color: var(--ok);
  margin-right: 8px;
  animation: toast-in 200ms var(--ease);
}

/* Two-column field pair */
.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* Segmented button control used in settings */
.segm {
  display: inline-flex;
  padding: 2px;
  border-radius: var(--r-2);
  background: var(--surface-3);
  gap: 1px;
}
.segm-item {
  padding: 4px 10px;
  border-radius: var(--r-1);
  font-size: var(--fz-12);
  font-weight: 500;
  color: var(--text-3);
  background: transparent;
  border: 0;
  cursor: pointer;
  white-space: nowrap;
  transition: color 80ms;
}
.segm-item:hover { color: var(--text-2); }
.segm-item.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--hairline);
}

/* AUTH section feedback text */
.settings-auth-hint {
  font-size: var(--fz-11);
  color: var(--text-3);
  font-style: italic;
}
.settings-auth-error {
  font-size: var(--fz-12);
  color: var(--err, oklch(0.6 0.18 20));
}
.settings-auth-ok {
  font-size: var(--fz-12);
  color: var(--ok);
  animation: toast-in 200ms var(--ease);
}

/* ============================================================
   Login screen
   ============================================================ */

.login-shell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
}

.login-card {
  width: 340px;
  padding: 32px 28px 28px;
  background: var(--surface);
  border-radius: var(--r-4);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.login-brand {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: var(--fz-28);
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0;
  text-align: center;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.login-label {
  font-size: var(--fz-12);
  font-weight: 500;
  color: var(--text-2);
}

.login-input {
  height: 34px;
  padding: 0 10px;
  border-radius: var(--r-2);
  border: 1px solid var(--hairline);
  background: var(--bg);
  color: var(--text);
  font-size: var(--fz-13);
  outline: none;
  transition: border-color 120ms var(--ease);
}

.login-input:focus {
  border-color: var(--accent);
}

.login-input:disabled {
  opacity: 0.5;
}

.login-error {
  font-size: var(--fz-12);
  color: var(--danger);
  margin: 0;
}

.login-submit {
  height: 36px;
  border-radius: var(--r-2);
  background: var(--accent);
  color: var(--text-inv);
  font-size: var(--fz-13);
  font-weight: 600;
  cursor: pointer;
  transition: opacity 120ms var(--ease);
  margin-top: 4px;
}

.login-submit:hover { opacity: 0.88; }
.login-submit:disabled { opacity: 0.5; cursor: default; }

/* ============================================================
   Spaces view — workspace list + detail
   ============================================================ */

/* Spaces / Bots use the standard `.view` + `.sidebar` + `.main` shell.
 * Below are list/detail-internal styles that live inside that shell. */

.spaces-list-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px 8px;
  flex-shrink: 0;
}
.spaces-list-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.spaces-list-head-sub {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
  padding: 0 2px;
}
.spaces-list-head-sub-val {
  color: var(--text-2);
}

.spaces-list-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 6px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.spaces-list-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: var(--r-2);
  cursor: pointer;
  transition: background 80ms var(--ease);
}
.spaces-list-row:hover { background: var(--surface-2); }
.spaces-list-row.active { background: var(--accent-soft); }

.spaces-list-row-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.spaces-ws-name {
  font-size: var(--fz-12);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spaces-list-row.active .spaces-ws-name { color: var(--accent-text); }

.spaces-ws-path {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spaces-ws-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  flex-shrink: 0;
  padding: 0 4px;
}

.spaces-list-row-acts {
  display: none;
  align-items: center;
  gap: 1px;
  flex-shrink: 0;
}
.spaces-list-row:hover .spaces-list-row-acts,
.spaces-list-row.active .spaces-list-row-acts { display: inline-flex; }
.spaces-list-row:hover .spaces-ws-meta,
.spaces-list-row.active .spaces-ws-meta { display: none; }

.spaces-new-form {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  margin-bottom: 4px;
  background: var(--surface-2);
  border-radius: var(--r-2);
}
.spaces-new-form .input { width: 100%; }
.spaces-new-form .select { width: 100%; }
.spaces-new-source { align-self: stretch; }
.spaces-new-source .segm-item { flex: 1; }
.spaces-new-path-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.spaces-new-path-row .input { flex: 1; min-width: 0; }
.spaces-browse-btn { flex-shrink: 0; }

.spaces-path-preview {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  color: var(--text-3);
}
.spaces-path-preview-lbl { color: var(--text-3); }
.spaces-path-preview-val { color: var(--text-2); word-break: break-all; }

.spaces-claude-md {
  flex: 1;
  width: 100%;
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  line-height: 1.5;
  resize: none;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-2);
}
.spaces-claude-md:focus { border-color: var(--accent); outline: none; }

/* CLAUDE.md inspector — 4th-level slide-in panel on Spaces tab. */
.spaces-inspector {
  flex: 0 0 480px;
  min-width: 320px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--hairline);
  background: var(--surface);
  padding: 12px;
  gap: 8px;
  animation: spaces-inspector-in 180ms var(--ease);
}
@keyframes spaces-inspector-in {
  from { opacity: 0; transform: translateX(8px); }
  to { opacity: 1; transform: none; }
}
.spaces-inspector-head {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--hairline);
}
.spaces-inspector-title {
  flex: 1;
  display: flex; flex-direction: column; gap: 2px;
}
.spaces-inspector-file {
  font-family: var(--font-mono);
  font-size: var(--fz-13);
  font-weight: 600;
  color: var(--text);
}
.spaces-inspector-ws {
  font-size: var(--fz-11);
  color: var(--text-3);
}
.spaces-inspector-foot {
  display: flex; align-items: center; gap: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--hairline);
}
.spaces-inspector-foot-spacer { flex: 1; }
.spaces-new-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.spaces-empty {
  font-size: var(--fz-12);
  color: var(--text-3);
  text-align: center;
  padding: 16px 8px;
  margin: 0;
}

.spaces-error {
  font-size: var(--fz-11);
  color: var(--danger);
  font-family: var(--font-mono);
  margin: 0;
}

.spaces-detail-empty {
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: var(--fz-13);
  padding: 20px 24px;
}

.spaces-detail-head {
  flex-shrink: 0;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: relative;
}
.spaces-detail-head::after {
  content: "";
  position: absolute;
  left: 16px; right: 16px; bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}
.spaces-detail-head-l {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.spaces-detail-head-r {
  display: flex;
  align-items: center;
  gap: 8px;
}

.spaces-detail-name {
  font-size: var(--fz-15);
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  margin: 0;
  cursor: text;
  border-radius: var(--r-1);
  padding: 2px 6px;
  margin-left: -6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spaces-detail-name:hover { background: var(--surface-2); }

.spaces-name-input {
  font-size: var(--fz-15);
  font-weight: 600;
  width: 100%;
}

.spaces-detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.spaces-fcard {
  background: var(--surface-2);
  border-radius: var(--r-3);
  overflow: hidden;
}
.spaces-fcard-head {
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.spaces-fcard-body {
  padding: 4px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.spaces-fcard-body-tight {
  gap: 4px;
}

.spaces-kv {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.spaces-kv-lbl {
  font-size: var(--fz-11);
  color: var(--text-3);
}
.spaces-kv-val {
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  color: var(--text);
  word-break: break-all;
}

.spaces-fcard-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.spaces-risk-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.spaces-risk-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.spaces-risk-label {
  width: 180px;
  flex-shrink: 0;
  font-size: var(--fz-12);
  color: var(--text-2);
}

.spaces-risk-pills {
  display: flex;
  gap: 4px;
}

.spaces-session-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.spaces-session-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--r-2);
  background: var(--surface-2);
}

.spaces-session-name {
  flex: 1;
  min-width: 0;
  font-size: var(--fz-12);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spaces-empty-sub {
  font-size: var(--fz-12);
  color: var(--text-3);
  margin: 0;
}


/* ============================================================
   Bots view
   ============================================================ */

/* — Platform color tokens (reused across list, detail, avatars) — */
.bot-platform-chip.discord { background: oklch(0.62 0.17 263 / 0.15); color: oklch(0.62 0.17 263); }
.bot-platform-chip.slack   { background: oklch(0.55 0.14 155 / 0.15); color: oklch(0.55 0.14 155); }

.bot-status-dot {
  flex-shrink: 0;
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* — Bots rail (ports design/bots.html .bots-rail / .rail-head / .bot-row) — */
.bots-rail { padding: 0; }
.bots-rail .rail-head {
  display: flex; flex-direction: row; align-items: center; justify-content: space-between;
  padding: 12px 14px 8px;
  flex-shrink: 0;
  gap: 8px;
}
.bots-rail .rail-head-title {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.bots-rail .rail-head-title b { color: var(--text-2); font-weight: 700; }
.btn-mini {
  background: none;
  border: 1px solid var(--surface-3);
  border-radius: var(--r-1);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background 80ms var(--ease), border-color 80ms var(--ease), color 80ms var(--ease);
}
.btn-mini:hover { background: var(--surface-2); border-color: var(--text-3); color: var(--text); }

.bots-rail .rail-body {
  flex: 1; overflow-y: auto;
  padding: 4px 6px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.bot-row {
  width: 100%;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 10px;
  border: 0;
  background: transparent;
  border-radius: var(--r-2);
  cursor: pointer;
  text-align: left;
  transition: background 80ms var(--ease);
  position: relative;
}
.bot-row:hover { background: var(--surface-2); }
.bot-row.active { background: var(--accent-soft); }
.bot-row.active::before {
  content: ""; position: absolute;
  left: 2px; top: 14px; bottom: 14px;
  width: 2px;
  border-radius: 1px;
  background: var(--accent);
}
.bot-platform-mark {
  width: 28px; height: 28px;
  border-radius: var(--r-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 700;
  letter-spacing: -0.02em;
}
.bot-platform-mark.discord { background: var(--discord-soft); color: var(--discord); }
.bot-platform-mark.slack   { background: var(--slack-soft);   color: var(--slack); }
.bot-row-info {
  min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.bot-row-label {
  font-size: var(--fz-13); font-weight: 500;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bot-row.active .bot-row-label { color: var(--accent-text); }
.bot-row-sub {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--text-3);
  white-space: nowrap; overflow: hidden;
}
.bot-row-sub .sep { opacity: 0.4; }
.bot-row-sub .ws { color: var(--text-2); }
.bot-row-sub .ws.unbound { color: var(--text-3); font-style: italic; }
.bot-row-meta {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  flex-shrink: 0;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.connected   { background: var(--ok);     box-shadow: 0 0 0 3px var(--ok-soft); }
.status-dot.disabled    { background: var(--text-3); opacity: 0.45; }
.status-dot.error       { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.status-dot.connecting  {
  background: var(--warn);
  box-shadow: 0 0 0 3px var(--warn-soft);
  animation: bot-status-pulse 1.4s ease-in-out infinite;
}
@keyframes bot-status-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(0.7); }
}

.bot-list-empty {
  font-size: var(--fz-12);
  color: var(--text-3);
  padding: 16px 12px;
  text-align: center;
  margin: 0;
}

/* — Detail header — */
.bot-detail { overflow: hidden; }
/* Status text+dot used inside cfg-stats and activity log. Color-only —
   the dot inherits currentColor. */
.bot-detail-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 600;
}
.bot-detail-status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.bot-detail-status-connected  { color: var(--ok); }
.bot-detail-status-connecting { color: var(--warn); }
.bot-detail-status-error      { color: var(--danger); }
.bot-detail-status-disabled   { color: var(--text-3); }

/* ============================================================
   Bot Detail (dashboard layout — single page, no tabs)
   Ports design/bots.html `.detail-head`, `.detail-bot-*`, `.platform-chip`,
   `.enable-switch`, `.section-grid`, `.mode-card`, `.danger-zone`.
   Existing `.bot-detail-status*` styles above are reused.
   ============================================================ */
.bot-detail .detail-head {
  flex-shrink: 0;
  padding: 14px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--hairline-2);
}
.bot-detail .detail-head-l {
  display: flex; align-items: center; gap: 12px;
  min-width: 0;
}
.bot-detail .detail-bot-mark {
  width: 36px; height: 36px;
  border-radius: var(--r-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}
.bot-detail .detail-bot-mark.discord { background: var(--discord-soft); color: var(--discord); }
.bot-detail .detail-bot-mark.slack   { background: var(--slack-soft);   color: var(--slack); }
.bot-detail .detail-bot-info {
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
}
.bot-detail .detail-bot-name {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 22px;
  font-style: italic;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bot-detail .detail-bot-sub {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-3);
  flex-wrap: wrap;
}
.bot-detail .detail-bot-sub b { color: var(--text-2); font-weight: 600; }
.bot-detail .detail-bot-sub-sep { opacity: 0.5; }
.bot-detail .detail-bot-sub-dim { color: var(--text-3); font-style: italic; }
.bot-detail .platform-chip {
  display: inline-flex; align-items: center;
  padding: 1px 8px;
  border-radius: var(--r-1);
  font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.06em;
  font-weight: 700;
}
.bot-detail .platform-chip.discord { background: var(--discord-soft); color: var(--discord); }
.bot-detail .platform-chip.slack   { background: var(--slack-soft);   color: var(--slack); }

.bot-detail .detail-head-r {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}

/* Header enable toggle — pill shape with label + knob inside. Plum on,
   neutral off. Color is intentionally NOT green to avoid confusion with
   connection status (which uses --ok). */
.enable-switch {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px 5px 12px;
  border-radius: var(--r-pill, 999px);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  cursor: pointer;
  transition: background 100ms var(--ease), color 100ms var(--ease), border-color 100ms var(--ease);
}
.enable-switch:hover { background: var(--surface-3); color: var(--text-2); }
.enable-switch[data-on] {
  color: var(--accent-text);
  border-color: oklch(from var(--accent) l c h / 0.3);
  background: var(--accent-soft);
}
.enable-switch:disabled { opacity: 0.6; cursor: wait; }
.enable-switch-knob {
  width: 26px; height: 14px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  position: relative;
  flex-shrink: 0;
  transition: background 100ms var(--ease);
}
.enable-switch-knob::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--text-inv);
  box-shadow: var(--shadow-1);
  transition: transform 120ms var(--ease);
}
.enable-switch-knob.on { background: var(--accent); }
.enable-switch-knob.on::after { transform: translateX(12px); }

/* Detail body — vertical sections with a 2-col grid in the middle. The
   cfg-card / mode-behavior / danger-zone / activity-log children all have
   `overflow: hidden` (for radius clipping), which makes `min-height: auto`
   resolve to 0 and lets the flex column collapse them under pressure. We
   counter that with `flex-shrink: 0` so each section keeps its content
   height; the scroll lives at .detail-body. */
.bot-detail .detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 20px;
  display: flex; flex-direction: column; gap: 16px;
  min-height: 0;
}
.bot-detail .detail-body > * { flex-shrink: 0; }
.bot-detail-stats {
  margin: 0 0 4px;
}
.bot-detail-stats .cfg-stat-value.bot-detail-status {
  font-family: var(--font-sans);
  font-size: 17px; font-weight: 500;
}
.bot-detail-status-err {
  display: inline-block;
  max-width: 240px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  vertical-align: bottom;
  color: var(--danger);
}
.bot-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 1100px) {
  .bot-detail-grid { grid-template-columns: 1fr; }
}
.bot-detail .cfg-card-head {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--hairline);
  text-transform: none;
  letter-spacing: 0;
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px;
}
.bot-detail .cfg-card-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.bot-detail .cfg-card-body {
  padding: 14px 16px 16px;
  display: flex; flex-direction: column; gap: 12px;
}

/* Mode behavior — interactive 2-col cards; click either to switch.
   Active side gets accent-soft fill + accent-text headline. */
.mode-behavior {
  display: flex; flex-direction: column; gap: 8px;
}
.mode-behavior-head { padding: 0 2px; }
.mode-behavior-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-3);
}
.mode-behavior-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 800px) {
  .mode-behavior-cards { grid-template-columns: 1fr; }
}
.mode-card {
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--hairline-2);
  border-radius: var(--r-2);
  text-align: left;
  cursor: pointer;
  transition: background 100ms var(--ease), border-color 100ms var(--ease);
}
.mode-card:hover { border-color: var(--text-3); }
.mode-card.active {
  background: var(--accent-soft);
  border-color: oklch(from var(--accent) l c h / 0.3);
}
.mode-card-head {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-2);
}
.mode-card.active .mode-card-head { color: var(--accent-text); }
.mode-card-icon { width: 13px; height: 13px; flex-shrink: 0; }
.mode-card-title { white-space: nowrap; }
.mode-card-active {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--accent-text);
  margin-left: auto;
}
.mode-card-desc {
  margin: 7px 0 0;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--text-2);
}

/* Activity log */
.activity-log-body {
  gap: 8px !important;
}
.activity-log-row {
  display: flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 11.5px;
}
.activity-log-row .al-key {
  width: 130px;
  color: var(--text-3);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.activity-log-row .al-val { color: var(--text-2); }
.activity-log-row .al-dim { color: var(--text-3); font-style: italic; }
.activity-log-error {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px;
  background: var(--danger-soft);
  border-radius: var(--r-1);
  font-size: 11px;
}
.al-error-tag {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--danger);
  flex-shrink: 0;
  padding-top: 2px;
}
.al-error-text { color: var(--text); word-break: break-word; }

/* Danger zone — irreversible removal only. */
.bot-detail .danger-zone {
  margin-top: 4px;
  padding: 14px 16px;
  border: 1px dashed oklch(from var(--danger) l c h / 0.35);
  border-radius: var(--r-3);
  background: oklch(from var(--danger) l c h / 0.03);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
.bot-detail .danger-zone-info {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0;
  flex: 1;
}
.bot-detail .danger-zone-title {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700;
  color: var(--danger);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.bot-detail .danger-zone-desc {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
}
.bot-detail .danger-zone-actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

/* — Tab body / frame — */
.bot-detail-body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.bot-tab-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px 0 24px;
}
.bot-tab-frame {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 24px 32px;
}
.bot-tab-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding-top: 4px;
}

/* — Field shims (for tabs that still use the old class names) — */
.bot-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.bot-field .input,
.bot-field .select { width: 100%; }
.bot-field-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fz-11);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.bot-field-saved {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px 1px 4px;
  border-radius: var(--r-pill);
  background: var(--ok-soft);
  color: var(--ok);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.bot-field-saved svg { width: 11px; height: 11px; }
.bot-field-hint {
  font-size: var(--fz-11);
  color: var(--text-3);
  margin: 0;
}

/* — Logs tab — */
.bot-logs-summary { gap: 10px; }
.bot-logs-summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--hairline);
}
.bot-logs-summary-row:last-child { border-bottom: 0; }
.bot-logs-key {
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.bot-logs-val {
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  color: var(--text);
}
.bot-logs-dim { color: var(--text-3); }
.bot-logs-error {
  margin-top: 6px;
  padding: 10px 12px;
  background: oklch(from var(--danger) l c h / 0.06);

  border-radius: 0 var(--r-1) var(--r-1) 0;
  display: flex;
  flex-direction: column;
  gap: 4px;

.bot-logs-error-tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--danger);
}
.bot-logs-error-text {
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  color: var(--text-2);
  word-break: break-word;
}
.bot-logs-empty {
  margin: 0;
  padding: 20px 12px;
  text-align: center;
  color: var(--text-3);
  font-size: var(--fz-12);
  font-family: var(--font-mono);
}

.bot-token-row {
  display: flex;
  gap: 4px;
}
.bot-token-input { flex: 1; }
.bot-token-show { flex-shrink: 0; }

.bot-error {
  font-size: var(--fz-11);
  color: var(--danger);
  font-family: var(--font-mono);
  margin: 0;
}

/* ============================================================
   Bots — New Bot form (renders in main pane, not sidebar)
   ============================================================ */

.bot-new-main {
  overflow-y: auto;
}
.bot-new-frame {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.bot-new-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 8px;
}
.bot-new-head-l {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.bot-new-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--text);
  margin: 0;
}
.bot-new-sub {
  font-size: var(--fz-13);
  color: var(--text-3);
  margin: 0;
}
.bot-new-platform-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0 6px;
}
.bot-new-platform-lbl {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
}
.bot-new-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  overflow: hidden;
}
.bot-new-card .fcard-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 14px 18px 6px;
  border-bottom: 1px solid var(--hairline);
  text-transform: none;
  letter-spacing: 0;
}
.bot-new-card-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-text);
  background: var(--accent-soft);
  padding: 2px 7px;
  border-radius: var(--r-1);
  letter-spacing: 0.04em;
}
.bot-new-card-title {
  font-size: var(--fz-14);
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.bot-new-card-hint {
  flex: 1;
  text-align: right;
  font-size: var(--fz-11);
  color: var(--text-3);
  font-family: var(--font-mono);
  text-transform: none;
  letter-spacing: 0;
}
.bot-new-card .fcard-body {
  padding: 16px 18px 18px;
  gap: 14px;
}
.bot-mono-input {
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  letter-spacing: 0.005em;
}
.bot-new-mode-hint {
  margin-top: 2px;
  text-transform: none;
  letter-spacing: 0;
}
.bot-new-error {
  margin: 0;
  padding: 10px 14px;
  background: oklch(from var(--danger) l c h / 0.08);
  border-left: 2px solid var(--danger);
  border-radius: 0 var(--r-2) var(--r-2) 0;
}
.bot-new-foot {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding-top: 4px;
  margin-top: 4px;
}

/* TokenField inside the new form: the show/hide button looks like a chip */
.bot-new-card .bot-token-row {
  position: relative;
}
.bot-new-card .bot-token-input {
  font-family: var(--font-mono);
  font-size: var(--fz-12);
  padding-right: 56px;
}
.bot-new-card .bot-token-show {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 3px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ============================================================
   Command Palette
   ============================================================ */

.pal-overlay {
  position: fixed; inset: 0;
  background: oklch(0 0 0 / 0.4);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-start; justify-content: center;
  padding-top: 10vh;
  z-index: 200;
  animation: pal-overlay-in 120ms var(--ease);
}
@keyframes pal-overlay-in { from { opacity: 0; } to { opacity: 1; } }

.pal-modal {
  width: 560px;
  max-width: calc(100vw - 32px);
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-2), 0 0 0 1px var(--hairline);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: pal-modal-in 160ms var(--ease);
  max-height: 70vh;
}
@keyframes pal-modal-in {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to   { opacity: 1; transform: none; }
}

.pal-search-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
}
.pal-search-ico {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--text-3);
}
.pal-input {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  font-size: var(--fz-14);
  color: var(--text);
  line-height: 1.4;
}
.pal-input::placeholder { color: var(--text-3); }
.pal-esc-hint {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  padding: 2px 6px;
  border-radius: var(--r-1);
  background: var(--surface-2);
  color: var(--text-3);
  border: 1px solid var(--hairline);
}

.pal-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.pal-empty {
  padding: 20px 16px;
  font-size: var(--fz-13);
  color: var(--text-3);
  text-align: center;
}

.pal-section-head {
  padding: 8px 14px 3px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-3);
}

.pal-row {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 7px 14px;
  border: 0; background: transparent;
  text-align: left; cursor: pointer;
  transition: background 60ms;
}
.pal-row:hover,
.pal-row.active { background: var(--surface-2); }
.pal-row.active .pal-row-label { color: var(--accent-text); }

.pal-row-label {
  flex-shrink: 0;
  font-size: var(--fz-13); font-weight: 500;
  color: var(--text);
  font-family: var(--font-mono);
}
.pal-row-sub {
  flex: 1;
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;
}
.pal-row-tag {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: var(--r-1);
  background: var(--surface-3);
  color: var(--text-3);
}
.pal-row-tag.files { background: oklch(from var(--ok) l c h / 0.1); color: var(--ok); }
.pal-row-tag.cmd   { background: var(--accent-soft); color: var(--accent-text); }

.pal-footer {
  display: flex; align-items: center; gap: 16px;
  padding: 7px 14px;
  border-top: 1px solid var(--hairline);
  flex-shrink: 0;
  font-size: 10.5px;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.pal-footer .kc {
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r-1);
  padding: 1px 4px;
  font-size: 10px;
}

.bot-delete-confirm-text {
  font-size: var(--fz-12);
  color: var(--danger);
  font-family: var(--font-mono);
}

/* ============================================================

   ============================================================ */
