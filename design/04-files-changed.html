<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gian — Files · Changed mode</title>
<meta name="viewport" content="width=1440, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>

/* ===== tokens.css ===== */
/* ============================================================
   Gian — Design Tokens
   Three themes (light / warm / dark) + accent system
   ============================================================ */

:root {
  /* Type scale */
  --font-sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "Instrument Serif", ui-serif, Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --fz-11: 11px;
  --fz-12: 12px;
  --fz-13: 13px;
  --fz-14: 14px;
  --fz-16: 16px;
  --fz-20: 20px;
  --fz-28: 28px;

  /* Radii — soft but restrained */
  --r-1: 4px;
  --r-2: 7px;
  --r-3: 10px;
  --r-4: 14px;
  --r-pill: 999px;

  /* Spacing (IDE-dense baseline) */
  --sp-1: 2px;
  --sp-2: 4px;
  --sp-3: 6px;
  --sp-4: 8px;
  --sp-5: 10px;
  --sp-6: 12px;
  --sp-7: 16px;
  --sp-8: 20px;
  --sp-9: 24px;

  --gutter: 3px;


  /* Chrome dimensions */
  --topbar-h: 42px;
  --nav-w: 56px;
  --rail-w: 272px;

  /* Motion */
  --ease: cubic-bezier(.2,.7,.2,1);

  /* Executor brand (same across themes) */
  --codex-h: 270;
  --codex: oklch(0.62 0.14 var(--codex-h));
  --codex-soft: oklch(0.62 0.14 var(--codex-h) / 0.12);
  --claude-h: 36;
  --claude: oklch(0.70 0.15 var(--claude-h));
  --claude-soft: oklch(0.70 0.15 var(--claude-h) / 0.14);

  /* Platform */
  --discord:      oklch(0.58 0.16 280);
  --discord-soft: oklch(0.58 0.16 280 / 0.14);
  --slack:        oklch(0.62 0.14 105);
  --slack-soft:   oklch(0.62 0.14 105 / 0.14);
}

/* ---------- Accent presets (default = plum) ----------
   Body-level fallback so unset / unknown accent values still resolve
   to a valid color. Specific presets override below. */
body                       { --accent-h: 310; --accent-c: 0.13; }
body[data-accent="plum"]   { --accent-h: 310; --accent-c: 0.13; }
body[data-accent="moss"]   { --accent-h: 150; --accent-c: 0.10; }
body[data-accent="ink"]    { --accent-h: 255; --accent-c: 0.11; }
body[data-accent="ember"]  { --accent-h:  30; --accent-c: 0.13; }

/* ============================================================
   THEME — LIGHT (cool cream, high softness, low contrast chrome)
   ============================================================ */
body[data-theme="light"] {
  --bg:            oklch(0.955 0.004 280);
  --surface:       oklch(1.000 0.000 0);
  --surface-2:    oklch(0.970 0.003 280);
  --surface-3:    oklch(0.935 0.005 280);
  --surface-inset: oklch(0.945 0.004 280);

  --text:          oklch(0.22 0.02 280);
  --text-2:        oklch(0.45 0.015 280);
  --text-3:        oklch(0.62 0.012 280);
  --text-inv:      oklch(0.98 0 0);

  --hairline:      oklch(0.22 0.02 280 / 0.08);
  --hairline-2:    oklch(0.22 0.02 280 / 0.04);

  --accent:        oklch(0.55 var(--accent-c) var(--accent-h));
  --accent-text:   oklch(0.42 var(--accent-c) var(--accent-h));
  --accent-soft:   oklch(0.55 var(--accent-c) var(--accent-h) / 0.12);
  --accent-ring:   oklch(0.55 var(--accent-c) var(--accent-h) / 0.30);

  --ok:    oklch(0.58 0.13 150);
  --ok-soft: oklch(0.58 0.13 150 / 0.13);
  --warn:  oklch(0.70 0.14 75);
  --warn-soft: oklch(0.70 0.14 75 / 0.15);
  --danger: oklch(0.58 0.18 25);
  --danger-soft: oklch(0.58 0.18 25 / 0.13);

  --shadow-1: 0 0 0 1px oklch(0.22 0.02 280 / 0.06), 0 1px 2px oklch(0.22 0.02 280 / 0.04);
  --shadow-2: 0 0 0 1px oklch(0.22 0.02 280 / 0.06), 0 6px 24px -8px oklch(0.22 0.02 280 / 0.18);

  /* — ported from design/tokens.css — --border alias for mp-think / inline borders */
  --border: oklch(0.22 0.02 280 / 0.12);

  color-scheme: light;
}

/* ============================================================
   THEME — WARM (cream paper, toasted walnut text)
   ============================================================ */
body[data-theme="warm"] {
  --bg:            oklch(0.955 0.020 80);
  --surface:       oklch(0.990 0.012 82);
  --surface-2:    oklch(0.965 0.018 80);
  --surface-3:    oklch(0.925 0.022 78);
  --surface-inset: oklch(0.940 0.020 80);

  --text:          oklch(0.30 0.04 55);
  --text-2:        oklch(0.48 0.035 60);
  --text-3:        oklch(0.62 0.025 65);
  --text-inv:      oklch(0.98 0.01 80);

  --hairline:      oklch(0.30 0.04 55 / 0.10);
  --hairline-2:    oklch(0.30 0.04 55 / 0.05);

  --accent:        oklch(0.52 var(--accent-c) var(--accent-h));
  --accent-text:   oklch(0.40 var(--accent-c) var(--accent-h));
  --accent-soft:   oklch(0.52 var(--accent-c) var(--accent-h) / 0.14);
  --accent-ring:   oklch(0.52 var(--accent-c) var(--accent-h) / 0.32);

  --ok:    oklch(0.55 0.13 150);
  --ok-soft: oklch(0.55 0.13 150 / 0.14);
  --warn:  oklch(0.65 0.14 65);
  --warn-soft: oklch(0.65 0.14 65 / 0.16);
  --danger: oklch(0.55 0.18 30);
  --danger-soft: oklch(0.55 0.18 30 / 0.14);

  --shadow-1: 0 0 0 1px oklch(0.30 0.04 55 / 0.07), 0 1px 2px oklch(0.30 0.04 55 / 0.05);
  --shadow-2: 0 0 0 1px oklch(0.30 0.04 55 / 0.08), 0 6px 24px -8px oklch(0.30 0.04 55 / 0.20);

  /* — ported from design/tokens.css — */
  --border: oklch(0.30 0.04 55 / 0.14);

  color-scheme: light;
}

/* ============================================================
   THEME — DARK (deep teal-ink, never pure black)
   ============================================================ */
body[data-theme="dark"] {
  --bg:            oklch(0.165 0.012 250);
  --surface:       oklch(0.210 0.014 250);
  --surface-2:    oklch(0.240 0.016 250);
  --surface-3:    oklch(0.285 0.018 250);
  --surface-inset: oklch(0.190 0.012 250);

  --text:          oklch(0.93 0.01 250);
  --text-2:        oklch(0.74 0.012 250);
  --text-3:        oklch(0.58 0.012 250);
  --text-inv:      oklch(0.18 0.01 250);

  --hairline:      oklch(0.93 0.01 250 / 0.08);
  --hairline-2:    oklch(0.93 0.01 250 / 0.04);

  --accent:        oklch(0.72 var(--accent-c) var(--accent-h));
  --accent-text:   oklch(0.80 var(--accent-c) var(--accent-h));
  --accent-soft:   oklch(0.72 var(--accent-c) var(--accent-h) / 0.18);
  --accent-ring:   oklch(0.72 var(--accent-c) var(--accent-h) / 0.40);

  --ok:    oklch(0.75 0.14 150);
  --ok-soft: oklch(0.75 0.14 150 / 0.16);
  --warn:  oklch(0.80 0.14 80);
  --warn-soft: oklch(0.80 0.14 80 / 0.18);
  --danger: oklch(0.72 0.17 25);
  --danger-soft: oklch(0.72 0.17 25 / 0.18);

  --shadow-1: 0 0 0 1px oklch(0.93 0.01 250 / 0.06);
  --shadow-2: 0 0 0 1px oklch(0.93 0.01 250 / 0.08), 0 10px 32px -8px oklch(0 0 0 / 0.55);

  /* — ported from design/tokens.css — */
  --border: oklch(0.93 0.01 250 / 0.12);

  color-scheme: dark;
}

/* ---------- Density ---------- */
body[data-density="compact"] { --rail-w: 250px; --topbar-h: 38px; --nav-w: 52px; }
body[data-density="cozy"]    { --rail-w: 272px; --topbar-h: 42px; --nav-w: 56px; }
body[data-density="roomy"]   { --rail-w: 300px; --topbar-h: 48px; --nav-w: 64px; }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--fz-13);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); color: var(--accent-text); }

/* Keycap */
kbd.kc {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  color: var(--text-3);
  background: var(--surface-2);
  border-radius: var(--r-1);
  box-shadow: inset 0 -1px 0 var(--hairline), 0 0 0 1px var(--hairline);
}

/* Hairline separator using gradient — soft fade instead of hard line */
.hairline {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}
.hairline-v {
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--hairline), transparent);
}


/* ===== shell.css ===== */
/* ============================================================
   Shell — topbar, nav, stage
   ============================================================ */

.app {
  display: grid;
  grid-template-rows: var(--topbar-h) 1fr;
  height: 100vh;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-6) 0 var(--sp-5);
  background: var(--bg);
}

.brand {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text);
  text-decoration: none;
  padding: 3px 8px 3px 4px;
  border-radius: var(--r-2);
}
.brand:hover { background: var(--surface-2); }
.brand-mark {
  width: 20px; height: 20px;
  color: var(--accent);
}
.brand-word {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 19px;
  letter-spacing: -0.02em;
  line-height: 1;
  padding-top: 2px;
}

/* Runner */
.runner-wrap { display: inline-flex; align-items: center; gap: 6px; }
.runner-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.runner-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 8px 4px 8px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  color: var(--text-2);
  transition: background 120ms var(--ease);
}
.runner-chip:hover { background: var(--surface-3); }
/* — ported from design/shell.css — runner chip focus ring */
.runner-chip:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
}
.runner-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
}
.runner-host { color: var(--text); font-weight: 600; }
.runner-sep { color: var(--text-3); }
.runner-caret { width: 10px; height: 10px; color: var(--text-3); }

/* Breadcrumbs */
.crumbs {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fz-12);
  color: var(--text-2);
  margin-left: 4px;
}
.crumb-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.crumb {
  padding: 3px 7px;
  border-radius: var(--r-1);
  cursor: pointer;
}
.crumb:hover { background: var(--surface-2); color: var(--text); }
.crumb.active { color: var(--text); font-weight: 500; }
.crumb-sep { color: var(--text-3); font-size: 11px; }

/* Workspace switcher button */
.crumb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 6px 3px 8px;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r-1, 4px);
  font-family: inherit;
  font-size: var(--fz-12);
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: background 100ms var(--ease), border-color 100ms var(--ease);
}
.crumb-btn:hover { background: var(--surface-3); border-color: var(--border); }
.crumb-btn-car { color: var(--text-3); font-size: 9px; }

/* Workspace popover */
.workspace-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 50;
  min-width: 240px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  box-shadow: var(--shadow-2);
  padding: 4px;
  display: flex; flex-direction: column;
  max-height: 320px;
  overflow-y: auto;
}
.workspace-popover-item {
  border: none; background: transparent;
  text-align: left;
  padding: 6px 10px;
  border-radius: var(--r-1, 4px);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
  width: 100%;
}
.workspace-popover-item:hover { background: var(--surface-2); }
.workspace-popover-item.active { background: var(--accent-soft); color: var(--accent-text); }
.workspace-popover-item-name {
  font-size: var(--fz-13); font-weight: 500;
}
.workspace-popover-item-path {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3);
}

.topbar-spacer { flex: 1; }

/* Command search */
.top-cmd {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 8px 4px 10px;
  width: 340px;
  border-radius: var(--r-2);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  color: var(--text-3);
  font-size: var(--fz-12);
  transition: background 120ms var(--ease), border-color 120ms var(--ease);
}
.top-cmd:hover { background: var(--surface-3); border-color: var(--border); color: var(--text-2); }
.top-cmd:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
  border-color: var(--accent-ring);
}
.top-cmd svg { width: 13px; height: 13px; flex-shrink: 0; }
.top-cmd span { flex: 1; text-align: left; }
.top-cmd .kc { font-family: var(--font-mono); flex-shrink: 0; }

.inbox-btn {
  position: relative;
  width: 28px; height: 28px;
  border-radius: var(--r-2);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
.inbox-btn:hover { background: var(--surface-2); color: var(--text); }
.inbox-btn:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
.inbox-btn:not([data-active]) { cursor: default; opacity: 0.55; }
.inbox-btn:not([data-active]):hover { background: transparent; color: var(--text-2); }
.inbox-btn svg { width: 15px; height: 15px; }
.inbox-count {
  position: absolute; top: 1px; right: 1px;
  min-width: 14px; height: 14px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--text-inv);
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700; line-height: 14px;
  text-align: center;
  box-shadow: 0 0 0 1.5px var(--bg);
}

/* — ported from design/shell.css — inbox wrap + badge + popover */
.inbox-wrap {
  position: relative;
}
/* .inbox-badge is the M5+ name for .inbox-count — same visual, alias in sync */
.inbox-badge {
  position: absolute; top: 1px; right: 1px;
  min-width: 14px; height: 14px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--text-inv);
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700; line-height: 14px;
  text-align: center;
  box-shadow: 0 0 0 1.5px var(--bg);
  pointer-events: none;
}
.inbox-btn[data-active] .inbox-badge {
  animation: inbox-pop 220ms var(--ease);
}
@keyframes inbox-pop {
  0% { transform: scale(0.6); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

/* Inbox approval popover */
.inbox-popover {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 300px;
  max-width: 380px;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-2), 0 0 0 1px var(--hairline);
  z-index: 120;
  overflow: hidden;
  animation: pop-in 120ms var(--ease);
}
.inbox-popover-header {
  padding: 8px 12px 6px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-3);
  border-bottom: 1px solid var(--hairline);
}
.inbox-popover-list {
  list-style: none;
  margin: 0; padding: 4px;
  display: flex; flex-direction: column; gap: 1px;
  max-height: 340px;
  overflow-y: auto;
}
.inbox-popover-item {
  display: block;
}
.inbox-popover-jump {
  display: flex; align-items: baseline; gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: 0; background: transparent;
  border-radius: var(--r-2);
  text-align: left; cursor: pointer;
  transition: background 60ms;
}
.inbox-popover-jump:hover { background: var(--surface-2); }
.inbox-popover-cat {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: var(--r-1);
  background: var(--warn-soft);
  color: var(--warn);
}
.inbox-popover-cat[data-category="high"] {
  background: var(--danger-soft);
  color: var(--danger);
}
.inbox-popover-desc {
  flex: 1;
  font-size: var(--fz-12);
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.avatar {
  width: 28px; height: 28px;
  border-radius: var(--r-2);
  background: var(--accent);
  color: var(--text-inv);
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ---------- Body ---------- */
.body {
  display: grid;
  grid-template-columns: var(--nav-w) 1fr;
  min-height: 0;
  padding: 0 var(--gutter) var(--gutter) 0;
}

/* ---------- Nav ---------- */
.nav {
  display: flex; flex-direction: column;
  align-items: center;
  padding: 6px 6px;
  gap: 1px;
}
.nav-btn {
  position: relative;
  width: 44px; height: 42px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  border-radius: var(--r-2);
  color: var(--text-3);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: color 120ms var(--ease), background 120ms var(--ease);
}
.nav-btn svg { width: 17px; height: 17px; }
.nav-btn:hover { color: var(--text); background: var(--surface-2); }
/* — ported from design/shell.css — focus-visible ring */
.nav-btn:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}
.nav-btn.active {
  color: var(--accent-text);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}
.nav-btn.active::before {
  content: "";
  position: absolute; left: -7px; top: 10px; bottom: 10px;
  width: 2px; border-radius: 0 2px 2px 0;
  background: var(--accent);
}
.nav-badge {
  position: absolute; top: 5px; right: 5px;
  min-width: 14px; height: 14px; padding: 0 4px;
  border-radius: 999px;
  background: var(--warn);
  color: var(--text-inv);
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700; line-height: 14px;
}
.nav-rule {
  width: 24px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
  margin: 6px 0;
}
.nav-spacer { flex: 1; }

/* ---------- Stage ---------- */
.stage {
  display: flex;
  min-width: 0; min-height: 0;
  gap: var(--gutter);
}

/* View: rail | main | [preview] — gap matches design (var(--gutter)). */
.view {
  display: flex;
  flex: 1;
  min-width: 0; min-height: 0;
  gap: var(--gutter);
  position: relative;
}

/* Invisible drag handle sitting on the seam between rail and main. Absolute
 * position so it adds zero width to the flex layout — visual gap stays at
 * var(--gutter) as the design intends. The 8px hitbox straddles the gap,
 * extending a few px into each adjacent pane so it's reliably clickable. */
.view-splitter {
  position: absolute;
  top: 0; bottom: 0;
  left: calc(var(--rail-w, 280px) + var(--gutter) / 2 - 4px);
  width: 8px;
  cursor: col-resize;
  z-index: 10;
}


/* Rail */
.rail {
  width: var(--rail-w);
  flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  min-height: 0;
}
.rail-head {
  padding: 10px 10px 8px;
  display: flex; flex-direction: column; gap: 8px;
  flex-shrink: 0;
}
.rail-head-row { display: flex; align-items: center; justify-content: space-between; }
.rail-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.rail-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 6px 8px;
}
.rail-group {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 10px 8px 4px;
}
.rail-group.needs-you-group {
  display: flex; align-items: center; gap: 6px;
  color: var(--warn);
  padding-top: 6px;
}
.rail-group.needs-you-group .rng-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn);
  animation: breath 1.8s ease-in-out infinite;
}
.rail-group.needs-you-group .rng-count {
  margin-left: auto;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 14px;
  padding: 0 5px;
  border-radius: 7px;
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
}

/* Main island */
.main {
  flex: 1; min-width: 420px;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  min-height: 0;
}
.main-head {
  flex-shrink: 0;
  padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  position: relative;
}
.main-head::after {
  content: "";
  position: absolute; left: 16px; right: 16px; bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}
.main-head-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.main-title {
  font-size: var(--fz-14); font-weight: 600;
  letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.main-head-r { display: flex; align-items: center; gap: 4px; }
.main-head-icon-btn {
  background: transparent;
  border: 0;
  border-radius: var(--r-1);
  padding: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-3);
  cursor: pointer;
  transition: color 100ms var(--ease), background 100ms var(--ease);
}
.main-head-icon-btn:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
.main-head-icon-btn:disabled { cursor: not-allowed; opacity: 0.45; }

/* Git status chip in main-head-r: branch + worktree marker + +N/-N. */
.main-head-changes {
  display: inline-flex; align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border: 0;
  border-radius: var(--r-1);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: background 100ms var(--ease), color 100ms var(--ease);
}
.main-head-changes:hover { background: var(--surface-2); color: var(--text); }
.main-head-changes .ghb-icon { width: 13px; height: 13px; color: var(--text-3); flex-shrink: 0; }
.main-head-changes:hover .ghb-icon { color: var(--text-2); }
.main-head-changes .ghb-branch { color: var(--text); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.main-head-changes .ghb-wt {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 1px 4px; border-radius: var(--r-1);
  background: var(--accent-soft); color: var(--accent-text);
}
.main-head-changes .ghb-clean { color: var(--text-3); font-weight: 500; }
.main-head-changes .scr-plus,
.main-head-changes .scr-minus {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.main-head-changes .scr-plus  { color: var(--ok); }
.main-head-changes .scr-minus { color: var(--warn); }
.main-head-changes:hover .scr-plus,
.main-head-changes:hover .scr-minus { filter: brightness(1.15); }

/* Wrapper anchors the dropdown menu to the ⋯ button. */
.main-head-menu-wrap { position: relative; display: inline-flex; }
.main-head-menu {
  top: calc(100% + 4px);
  right: 0;
  left: auto;
}

/* Preview island */
.preview {
  width: 400px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  min-height: 0;
}
.preview { display: none; }
.preview.open { display: flex; }
.preview.hidden { display: none; }

@media (max-width: 1180px) {
  /* Inspector overlays the main pane on small viewports */
  .preview.open {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    z-index: 5;
    box-shadow: -16px 0 32px -16px oklch(0 0 0 / 0.25);
  }
}

.main-head { flex-wrap: wrap; row-gap: 4px; }
.main-head-l { flex-wrap: wrap; row-gap: 4px; }

/* Proto bar */
.proto-bar {
  position: fixed; left: 50%; bottom: 10px;
  transform: translateX(-50%);
  z-index: 80;
  display: flex; gap: 2px;
  padding: 3px;
  background: var(--text);
  border-radius: var(--r-2);
  font-family: var(--font-mono);
  font-size: 10px;
}
.proto-btn {
  padding: 4px 9px;
  border-radius: var(--r-1);
  color: oklch(1 0 0 / 0.55);
}
.proto-btn:hover { color: oklch(1 0 0 / 0.85); }
.proto-btn.active { background: oklch(1 0 0 / 0.15); color: #fff; }


/* ===== components.css ===== */
/* ============================================================
   Shared components — rail-item, buttons, badges, cards
   ============================================================ */

/* ---------- Rail item ---------- */
.rail-item {
  position: relative;
  display: block;
  padding: 7px 8px 8px;
  border-radius: var(--r-2);
  width: 100%;
  text-align: left;
  transition: background 80ms var(--ease);
  cursor: pointer;
}
.rail-item:hover { background: var(--surface-2); }
.rail-item.active {
  background: var(--accent-soft);
}
.rail-item.active .ri-title { color: var(--accent-text); }

/* Executor identity lives in the row2 text chip (ri-exec-name) now —
   the tiny avatar square was redundant with it. Keep the class as a
   no-op so any stray markup doesn't reserve space. */
.ri-avatar { display: none; }

.ri-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ri-row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ri-row1 > .ri-title { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri-row1 > .pill, .ri-row1 > .ri-flag, .ri-row1 > .ri-ch { flex-shrink: 0; }
.ri-title {
  font-size: var(--fz-13); font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}
.ri-row2 {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  min-width: 0;
}
.ri-row2 > * { white-space: nowrap; flex-shrink: 0; }
.ri-row2 > .ri-sub { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ri-exec-name {
  color: var(--codex);
  font-weight: 600;
}
.ri-exec-name.claude { color: var(--claude); }
.ri-exec-name.codex { color: var(--codex); }
.ri-dot-sep { color: var(--text-3); opacity: 0.5; }
.ri-sub {
  color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ri-turn {
  color: var(--accent-text);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.ri-age {
  position: absolute;
  right: 10px;
  bottom: 8px;
  color: var(--text-3);
  font-family: var(--font-mono);
  font-size: 10px;
  pointer-events: none;
}
.rail-item.active .ri-age { color: var(--text-2); }
/* Reserve room on row2 so the absolute-positioned age never overlaps text */
.ri-row2 { padding-right: 36px; }

/* — ported from design/components.css — rail-item focus-visible */
.rail-item:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

/* Status pill on rail items */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px;
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.5;
  white-space: nowrap;
}
/* Tiny spinner — used for inline loading states. */
.spinner {
  width: 12px; height: 12px;
  border: 1.5px solid var(--surface-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  display: inline-block;
  animation: spinner-rot 0.8s linear infinite;
  flex-shrink: 0;
}
@keyframes spinner-rot { to { transform: rotate(360deg); } }

.cfg-wt-loading {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-3);
  font-size: var(--fz-12);
}

.pill::before {
  content: "";
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}
.pill.run   { color: var(--accent-text); background: var(--accent-soft); }
.pill.done  { color: var(--ok);          background: var(--ok-soft); }
.pill.wait  { color: var(--warn);        background: var(--warn-soft); }
.pill.err   { color: var(--danger);      background: var(--danger-soft); }
.pill.idle  { color: var(--text-3);      background: var(--surface-2); }

.pill.run::before { animation: breath 1.8s ease-in-out infinite; }

/* Done = terminal completion. Replace dot with a check glyph so it reads
   "finished" at a glance, distinct from a "live/healthy" green dot. */
.pill.done::before {
  content: "";
  width: 8px; height: 8px;
  background: none;
  border-radius: 0;
  border-bottom: 1.5px solid currentColor;
  border-right: 1.5px solid currentColor;
  transform: rotate(45deg) translate(-1px, -1px);
  margin-right: 1px;
}

/* Err = warning glyph, distinct from a plain dot */
.pill.err::before {
  content: "!";
  width: auto; height: auto; background: none; border-radius: 0;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 800; line-height: 1;
  padding: 0 3px;
  border: 1px solid currentColor;
  border-radius: 50%;
}
@keyframes breath { 0%,100% { opacity: 0.55; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

/* Waiting-on-you flag (important for approval UX) */
.ri-flag {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 600;
  color: var(--warn);
  padding: 1px 5px;
  background: var(--warn-soft);
  border-radius: var(--r-1);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-2);
  font-size: var(--fz-12); font-weight: 500;
  white-space: nowrap;
  transition: background 100ms var(--ease), color 100ms var(--ease), box-shadow 100ms var(--ease);
  color: var(--text);
}
.btn svg { width: 13px; height: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn.primary {
  background: var(--accent);
  color: var(--text-inv);
  box-shadow: 0 0 0 1px oklch(0 0 0 / 0.1) inset, 0 1px 2px oklch(0 0 0 / 0.15);
}
.btn.primary:hover { filter: brightness(1.06); }

.btn.secondary {
  background: var(--surface-2);
  color: var(--text);
}
.btn.secondary:hover { background: var(--surface-3); }

.btn.ghost { color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }

.btn.danger {
  background: var(--danger-soft); color: var(--danger);
}
.btn.danger:hover { filter: brightness(0.95); }

.btn.danger-ghost {
  color: var(--danger);
  border: 1px solid var(--danger-soft);
  background: transparent;
}
.btn.danger-ghost:hover {
  background: var(--danger-soft);
  border-color: var(--danger);
}
.btn.danger-ghost svg {
  width: 13px; height: 13px;
  margin-right: 4px;
  vertical-align: -2px;
}

/* — ported from design/components.css — focus-visible rings */
.btn:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
}
.btn.primary:focus-visible {
  outline-color: var(--accent);
  outline-offset: 3px;
}
.btn.danger:focus-visible,
.btn.danger-ghost:focus-visible {
  outline-color: var(--danger);
}

.btn.sm { height: 22px; font-size: var(--fz-11); padding: 0 8px; }
.btn.xs { height: 20px; font-size: var(--fz-11); padding: 0 6px; }
.btn.icon { width: 26px; padding: 0; }
.btn.sm.icon { width: 22px; }

/* Chips / tags */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
}
.chip.codex  { background: var(--codex-soft);  color: var(--codex); }
.chip.claude { background: var(--claude-soft); color: var(--claude); }

/* Select */
.select {
  appearance: none;
  background: var(--surface-2);
  color: var(--text);
  border: none;
  padding: 5px 22px 5px 8px;
  border-radius: var(--r-2);
  font-size: var(--fz-12);
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(-45deg, transparent 50%, var(--text-3) 50%);
  background-position: right 10px top 50%, right 6px top 50%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  outline: none;
  cursor: pointer;
}
.select:focus { box-shadow: 0 0 0 2px var(--accent-ring); }

/* Input */
.input {
  background: var(--surface-2);
  color: var(--text);
  padding: 6px 10px;
  border-radius: var(--r-2);
  border: none;
  outline: none;
  font-size: var(--fz-12);
  transition: box-shadow 100ms var(--ease), background 100ms var(--ease);
}
.input:focus {
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--accent-ring);
}
.input::placeholder { color: var(--text-3); }

/* Field */
.field { display: flex; flex-direction: column; gap: 4px; }
.field-lbl {
  font-size: var(--fz-11); font-weight: 600;
  color: var(--text-2);
  display: flex; justify-content: space-between; align-items: center;
}
.field-hint { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }

/* Toggle group (Segmented) */
.segm {
  display: inline-flex;
  padding: 2px;
  background: var(--surface-2);
  border-radius: var(--r-2);
  gap: 1px;
}
.segm-item {
  padding: 4px 10px;
  border-radius: var(--r-1);
  font-size: var(--fz-11); font-weight: 500;
  color: var(--text-2);
  transition: background 100ms var(--ease), color 100ms var(--ease);
}
.segm-item:hover { color: var(--text); }
.segm-item.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--hairline);
}

/* Form card */
.fcard {
  background: var(--surface-2);
  border-radius: var(--r-3);
  overflow: hidden;
}
.fcard-head {
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.fcard-body {
  padding: 4px 14px 14px;
  display: flex; flex-direction: column; gap: 12px;
}

/* Popovers */
.popover {
  position: absolute;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-2);
  padding: 8px;
  min-width: 320px;
  max-width: 380px;
  z-index: 60;
}

/* Runner popover */
.runner-pop { padding: 4px; }
.runner-pop-head {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 4px 6px;
}
.runner-pop-host { min-width: 0; flex: 1; }
.runner-pop-name {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  color: var(--text);
}
.runner-pop-meta {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--text-3);
  margin-top: 2px;
}
.runner-pop-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  column-gap: 16px; row-gap: 5px;
  margin: 0; padding: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.runner-pop-list dt { color: var(--text-3); }
.runner-pop-list dd {
  margin: 0;
  color: var(--text);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.runner-pop-actions {
  display: flex; gap: 4px;
  padding: 2px 4px 4px;
}

/* Sheets */
.sheet-overlay {
  position: fixed; inset: 0;
  background: oklch(0 0 0 / 0.32);
  backdrop-filter: blur(4px);
  display: none;
  align-items: stretch; justify-content: flex-end;
  padding: var(--gutter);
  z-index: 70;
}
.sheet-overlay.open { display: flex; }
.sheet {
  width: 380px;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-2);
  overflow-y: auto;
  padding: 18px;
  display: flex; flex-direction: column; gap: 18px;
  animation: sheet-in 220ms var(--ease);
}
@keyframes sheet-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

/* Toasts */
.toasts {
  position: fixed; top: 8px; right: 8px;
  z-index: 90;
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  min-width: 260px; max-width: 360px;
  background: var(--surface);
  border-radius: var(--r-2);
  box-shadow: var(--shadow-2);
  font-size: var(--fz-12);
  animation: toast-in 200ms var(--ease);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.toast-ico { width: 14px; height: 14px; flex-shrink: 0; color: var(--ok); }
.toast-title { font-weight: 600; }
.toast-desc { color: var(--text-3); font-size: var(--fz-11); }

/* Empty state */
.empty {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  color: var(--text-3);
  font-size: var(--fz-12);
  text-align: center;
}
.empty-ico {
  width: 44px; height: 44px;
  border-radius: var(--r-3);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
}
.empty-ico svg { width: 20px; height: 20px; color: var(--text-3); }


/* ===== coding.css ===== */
/* ============================================================
   Session title inline rename
   ============================================================ */
.main-title-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.main-title-edit-btn {
  border: none;
  background: transparent;
  color: var(--text-3);
  padding: 2px;
  border-radius: var(--r-1, 4px);
  cursor: pointer;
  display: flex;
  align-items: center;
}
.main-title-edit-btn:hover { background: var(--surface-2); color: var(--text); }
.main-title-input {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-1, 4px);
  padding: 2px 6px;
  font-size: var(--fz-14);
  font-weight: 600;
  color: var(--text);
  outline: none;
  min-width: 200px;
}
.main-title-input:focus { border-color: var(--accent); }

/* ============================================================
   WS disconnect banner — fixed at top of viewport
   ============================================================ */
.ws-disconnect-banner {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 32px;
  background: var(--danger);
  color: var(--text-inv, #fff);
  font-size: var(--fz-12);
  font-weight: 600;
  letter-spacing: 0.01em;
  animation: banner-in 180ms var(--ease);
}
@keyframes banner-in { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
.ws-disconnect-icon {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: oklch(from var(--text-inv, #fff) l c h / 0.7);
  animation: pulse-bad 1.2s ease-in-out infinite;
}
@keyframes pulse-bad {
  0%,100% { opacity: 0.5; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1); }
}

/* ============================================================
   Connection status popover (Topbar)
   ============================================================ */
.runner-wrap {
  position: relative;
}
.status-popover {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  min-width: 260px;
  background: var(--surface-2);
  border-radius: var(--r-3);
  box-shadow: 0 0 0 1px var(--hairline), 0 4px 20px oklch(0 0 0 / 0.18);
  z-index: 120;
  animation: pop-in 120ms var(--ease);
}
@keyframes pop-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.status-popover-header {
  padding: 8px 12px 6px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-3);
  border-bottom: 1px solid var(--hairline);
}
.status-popover-list {
  list-style: none;
  margin: 0; padding: 4px;
  display: flex; flex-direction: column; gap: 1px;
}
.status-popover-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--r-1);
}
.status-dot {
  flex-shrink: 0;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-3);
}
.status-dot[data-state="ok"]  { background: var(--ok); }
.status-dot[data-state="bad"] { background: var(--danger); }
.status-dot[data-state="none"]{ background: var(--surface-3); }
.status-comp-label {
  font-size: var(--fz-12);
  color: var(--text);
  font-weight: 500;
  flex-shrink: 0;
}
.status-comp-detail {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--danger);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status-reconnect-btn {
  flex-shrink: 0;
  margin-left: auto;
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: var(--r-1);
  color: var(--text-2);
  border: 1px solid var(--hairline);
  background: transparent;
  cursor: pointer;
  transition: background 100ms, color 100ms;
}
.status-reconnect-btn:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
}
.status-reconnect-btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
.runner-dot[data-state="warn"] {
  background: var(--warn);
}

/* ============================================================
   Coding view — transcript, approval, queue, preview
   ============================================================ */

.transcript-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px 10px;
  min-height: 0;
}
.transcript {
  max-width: 820px;
  margin: 0 auto;
  display: flex; flex-direction: column; gap: 18px;
}

/* Turn marker — serif timestamp spanning the column */
.turn-mark {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-3);
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.turn-mark::before, .turn-mark::after {
  content: "";
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}

/* Message */
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }

.msg-av {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: var(--r-2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
}
.msg-av.user { background: var(--accent-soft); color: var(--accent-text); }
.msg-av.codex { background: var(--codex-soft); color: var(--codex); }
.msg-av.claude { background: var(--claude-soft); color: var(--claude); }

/* Continuation rows: a message from the same sender as the previous one
 * suppresses the avatar + author/time meta row to stop the transcript from
 * looking like a name-tag wall. The spacer keeps the text column aligned. */
.msg-av-spacer {
  flex-shrink: 0;
  width: 24px;
  height: 0;
}
.msg.continuation { margin-top: -4px; }

.msg-body { flex: 1; min-width: 0; }
.msg.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }

.msg-meta {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 3px;
  font-size: var(--fz-11);
  color: var(--text-3);
}
.msg.user .msg-meta { flex-direction: row-reverse; }
.msg-author { font-weight: 600; color: var(--text-2); }
.msg-author.codex { color: var(--codex); }
.msg-author.claude { color: var(--claude); }
.msg-time { font-family: var(--font-mono); font-size: 10.5px; }

.msg-text {
  font-size: var(--fz-13);
  line-height: 1.6;
  color: var(--text);
}
.msg-text p + p { margin-top: 6px; }
/* User input is plain text — preserve newlines without enabling Markdown. */
.msg-text.user-text {
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-text code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 1px 5px;
  border-radius: var(--r-1);
  background: var(--surface-2);
  color: var(--text);
}

/* Markdown rendering inside assistant bubbles */
.msg-text.md > * { margin: 0; }
.msg-text.md > * + * { margin-top: 8px; }
.msg-text.md h1,
.msg-text.md h2,
.msg-text.md h3,
.msg-text.md h4 {
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.msg-text.md h1 { font-size: 17px; margin-top: 12px; }
.msg-text.md h2 { font-size: 15px; margin-top: 12px; }
.msg-text.md h3 { font-size: 13.5px; margin-top: 10px; }
.msg-text.md h4 { font-size: 12.5px; color: var(--text-2); }
.msg-text.md ul,
.msg-text.md ol {
  padding-left: 22px;
}
.msg-text.md li + li { margin-top: 3px; }
.msg-text.md li > p { margin: 0; }
.msg-text.md pre {
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.55;
  padding: 9px 12px;
  border-radius: var(--r-2);
  background: var(--surface-2);
  color: var(--text);
  overflow-x: auto;
  white-space: pre;
}
.msg-text.md pre code {
  background: transparent;
  padding: 0;
  font-size: inherit;
  border-radius: 0;
}
.msg-text.md blockquote {
  border-left: 2px solid var(--surface-3);
  padding-left: 10px;
  color: var(--text-2);
}
.msg-text.md a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in oklch, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
}
.msg-text.md a:hover { text-decoration-color: var(--accent); }
.msg-text.md hr {
  border: none;
  border-top: 1px solid var(--surface-3);
  margin: 10px 0;
}
.msg-text.md table {
  border-collapse: collapse;
  font-size: 12px;
}
.msg-text.md th,
.msg-text.md td {
  border: 1px solid var(--surface-3);
  padding: 4px 8px;
  text-align: left;
}
.msg-text.md th { background: var(--surface-2); font-weight: 600; }

/* Token usage chip in session header */
.usage-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-2);
  margin-right: 8px;
}
.usage-chip .usage-num { color: var(--text); font-weight: 600; }
.usage-chip .usage-pct { color: var(--text-3); }

.msg.user .msg-text {
  max-width: 88%;
  padding: 7px 11px;
  background: var(--accent-soft);
  color: var(--accent-text);
  border-radius: var(--r-2);
}

/* Tool card — used for Read / Edit / Run / Search */
.tool {
  margin: 8px 0;
  background: var(--surface-2);
  border-radius: var(--r-2);
  overflow: hidden;
}
.tool-head {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 10px;
  font-size: var(--fz-11);
  color: var(--text-2);
  cursor: pointer;
  transition: background 100ms;
}
.tool-head:hover { background: var(--surface-3); }
.tool-head-ico { width: 11px; height: 11px; color: var(--text-3); }
.tool-head-verb {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-3);
}
.tool-head-path {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
}
.tool-head-stat {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
}
.tool-head-stat .add { color: var(--ok); }
.tool-head-stat .del { color: var(--danger); }

.tool-body {
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.7;
  max-height: 260px;
  overflow-y: auto;
}
.diff-ln { display: flex; padding: 0 10px; }
.diff-num { width: 32px; flex-shrink: 0; color: var(--text-3); text-align: right; padding-right: 10px; user-select: none; }
.diff-txt { flex: 1; white-space: pre; }
.diff-ln.add { background: oklch(from var(--ok) l c h / 0.08); }
.diff-ln.add .diff-num { color: var(--ok); }
.diff-ln.del { background: oklch(from var(--danger) l c h / 0.08); }
.diff-ln.del .diff-num { color: var(--danger); }
/* Minimal syntax coloring */
.tk-kw { color: var(--accent-text); }
.tk-str { color: var(--ok); }
.tk-fn { color: var(--claude); }
.tk-cm { color: var(--text-3); font-style: italic; }

/* File change tags */
.fchanges { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 2px; }
.fctag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px 2px 6px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-2);
  transition: all 100ms var(--ease);
  cursor: pointer;
}
.fctag:hover { background: var(--accent-soft); color: var(--accent-text); }
.fctag-dot { width: 6px; height: 6px; border-radius: 50%; }
.fctag-dot.mod { background: var(--warn); }
.fctag-dot.add { background: var(--ok); }
.fctag-dot.del { background: var(--danger); }

/* Activity ticker */
.ticker {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 2px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
}
.ticker .dots { display: inline-flex; gap: 3px; }
.ticker .dots span {
  width: 3px; height: 3px; border-radius: 50%;
  background: currentColor;
  animation: dot 1.4s infinite ease-in-out both;
}
.ticker .dots span:nth-child(1) { animation-delay: -0.32s; }
.ticker .dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes dot { 0%,80%,100% { opacity: 0.3; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

/* ============================================================
   Approval card — the important UX piece
   ============================================================ */
.approval {
  margin: 12px 0;
  border-radius: var(--r-3);
  background: var(--surface-2);
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--hairline), 0 0 0 3px var(--warn-soft);
  transition: box-shadow 140ms var(--ease);
}
.approval.high {
  box-shadow: 0 0 0 1px oklch(from var(--danger) l c h / 0.3), 0 0 0 4px var(--danger-soft);
}
/* low risk: softer warn ring */
.approval.low {
  box-shadow: 0 0 0 1px var(--hairline), 0 0 0 2px var(--ok-soft);
}
.approval.low .approval-ico { background: var(--ok-soft); color: var(--ok); }
/* AskUserQuestion variant — same affordance, accent ring (blue/info) so it
   reads visually as "input wanted" not "permission gate". */
.approval.question {
  box-shadow: 0 0 0 1px var(--hairline), 0 0 0 3px var(--accent-soft);
}
.approval.question .approval-ico { background: var(--accent-soft); color: var(--accent-text); }
.approval.question .approval-risk { background: var(--accent-soft); color: var(--accent-text); }
.question-body {
  padding: 4px 14px 10px;
  display: flex; flex-direction: column; gap: 14px;
}
.question-block { display: flex; flex-direction: column; gap: 6px; }
.question-text {
  font-size: var(--fz-13);
  color: var(--text);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.question-header {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-3);
  background: var(--surface-3);
  padding: 1px 6px;
  border-radius: var(--r-1);
}
.question-options {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex; flex-direction: column; gap: 4px;
}
.question-option > label {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 6px;
  border-radius: var(--r-1);
  cursor: pointer;
}
.question-option > label:hover { background: var(--surface-3); }
.question-option-label { font-size: var(--fz-13); color: var(--text); }
.question-option-desc {
  font-size: 11.5px;
  color: var(--text-3);
  margin-left: 6px;
}
.question-option--other input[type='text'] {
  flex: 1;
  font-family: var(--font-sans);
  font-size: var(--fz-13);
  padding: 3px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--r-1);
  background: var(--surface);
  color: var(--text);
}
.question-option--other input[type='text']:focus { outline: 1px solid var(--accent-text); }
.approval-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 8px;
}
.approval-ico {
  width: 28px; height: 28px; border-radius: var(--r-2);
  background: var(--warn-soft); color: var(--warn);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  /* — ported from design/coding.css — smooth state transition */
  transition: background 120ms var(--ease), color 120ms var(--ease);
}
.approval-ico svg { width: 14px; height: 14px; }
.approval.high .approval-ico { background: var(--danger-soft); color: var(--danger); }
.approval-title {
  font-size: var(--fz-12); font-weight: 600;
  color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.approval-risk {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 1px 5px; border-radius: var(--r-1);
  background: var(--warn-soft); color: var(--warn);
}
.approval.high .approval-risk { background: var(--danger-soft); color: var(--danger); }

/* Risk pill subclasses (low / medium / high) */
.approval-risk--low     { background: var(--ok-soft) !important; color: var(--ok) !important; }
.approval-risk--medium  { background: var(--warn-soft); color: var(--warn); }
.approval-risk--high    { background: var(--danger-soft) !important; color: var(--danger) !important; }

.approval-sub {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}

.approval-cmd {
  margin: 0 12px 10px;
  padding: 8px 10px;
  border-radius: var(--r-2);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-all;
}
.approval-cmd .prompt { color: var(--text-3); user-select: none; }
/* Resolved state: grey out the command row */
.approval-cmd--resolved { color: var(--text-3); opacity: 0.65; }

/* ExitPlanMode plan: markdown-rendered plan content. Rich formatting,
 * scrollable so a long plan doesn't push the approve buttons offscreen. */
.approval-plan {
  margin: 0 12px 10px;
  padding: 12px 14px;
  border-radius: var(--r-2);
  background: var(--surface);
  max-height: 420px;
  overflow-y: auto;
}
.approval-plan-md {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
}
.approval-plan-md > :first-child { margin-top: 0; }
.approval-plan-md > :last-child { margin-bottom: 0; }
.approval-plan-md h1,
.approval-plan-md h2,
.approval-plan-md h3,
.approval-plan-md h4 {
  font-weight: 600;
  margin: 12px 0 4px;
  line-height: 1.3;
}
.approval-plan-md h1 { font-size: 15px; }
.approval-plan-md h2 { font-size: 14px; }
.approval-plan-md h3,
.approval-plan-md h4 { font-size: 13px; }
.approval-plan-md p { margin: 6px 0; }
.approval-plan-md ul,
.approval-plan-md ol { margin: 6px 0; padding-left: 22px; }
.approval-plan-md li { margin: 2px 0; }
.approval-plan-md code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 3px;
}
.approval-plan-md pre {
  margin: 8px 0;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: var(--r-2);
  overflow-x: auto;
}
.approval-plan-md pre code {
  background: transparent;
  padding: 0;
  font-size: 11.5px;
}
.approval-plan-md hr {
  border: none;
  border-top: 1px solid var(--hairline-1);
  margin: 12px 0;
}
.approval-plan-md a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.approval-plan-md blockquote {
  border-left: 2px solid var(--surface-3);
  padding-left: 10px;
  margin: 6px 0;
  color: var(--text-2);
}
.approval-plan-md table {
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 12px;
}
.approval-plan-md th,
.approval-plan-md td {
  border: 1px solid var(--hairline-1);
  padding: 4px 8px;
  text-align: left;
}
.approval-plan-md th { background: var(--surface-2); font-weight: 600; }
.approval-plan--resolved { opacity: 0.7; }
.approval-plan--drawer {
  /* In the 4th-level drawer the parent already gives us padding + the
   * preview-body scrolls — drop the inline-card chrome and let the markdown
   * fill the column. */
  margin: 0;
  padding: 0;
  background: transparent;
  max-height: none;
  overflow: visible;
}

/* ─────────────────────────────────────────────────────────────────────────
   Plan chip — persistent entry point above the composer for the latest
   exit_plan_mode approval. Click → opens the plan markdown in the 4th-level
   FilePreviewDrawer.
   ───────────────────────────────────────────────────────────────────────── */
.plan-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
  margin: 4px 12px 6px;
  padding: 4px 10px;
  border: 1px solid var(--hairline-1);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.plan-chip:hover {
  background: var(--surface-2);
  border-color: var(--hairline-2, var(--hairline-1));
  color: var(--text);
}
.plan-chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.plan-chip-label { letter-spacing: 0.02em; }
.plan-chip-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  background: var(--text-3);
}
.plan-chip-dot--pending { background: var(--warn, #f5a524); }
.plan-chip-dot--accepted { background: var(--ok, #22c55e); }
.plan-chip-dot--declined { background: var(--err, #ef4444); }

.approval-actions {
  display: flex; align-items: center; gap: 4px;
  padding: 0 10px 10px;
  flex-wrap: wrap;
}
.approval-actions .spacer { flex: 1; }
.approval-tip {
  font-size: 10.5px; color: var(--text-3);
  font-family: var(--font-mono);
}

/* ============================================================
   Composer + Queue drawer
   ============================================================ */
.composer-wrap {
  flex-shrink: 0;
  padding: 8px 16px 12px;
  position: relative;
}
.composer-wrap::before {
  content: "";
  position: absolute; left: 24px; right: 24px; top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}

.queue-drawer {
  max-width: 820px; margin: 0 auto 6px;
  background: var(--surface-2);
  border-radius: var(--r-2) var(--r-2) 0 0;
  overflow: hidden;
  animation: drawer-in 180ms var(--ease);
}
@keyframes drawer-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.qd-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 12px;
  cursor: pointer;
}
.qd-title {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  color: var(--warn);
  text-transform: uppercase; letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 6px;
}
.qd-count {
  padding: 0 5px; border-radius: var(--r-pill);
  background: var(--warn-soft); color: var(--warn);
  font-size: 10px; font-weight: 700;
}
.qd-sub {
  font-size: 10.5px; color: var(--text-3);
  margin-left: 4px;
}
.qd-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.qd-body {
  padding: 4px 6px 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.qd-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center; gap: 8px;
  padding: 6px 8px;
  border-radius: var(--r-1);
  background: var(--surface);
  font-size: var(--fz-12);
}
.qd-item:hover { background: var(--surface); }
.qd-idx {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  color: var(--text-3);
  text-align: center;
}
.qd-text {
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qd-item-act {
  display: flex; align-items: center; gap: 1px;
  opacity: 0.7;
  transition: opacity 100ms;
}
.qd-item:hover .qd-item-act { opacity: 1; }
.qd-item-act .btn { height: 20px; width: 20px; }
.qd-item-act .btn svg { width: 11px; height: 11px; }

/* Composer */
.composer {
  max-width: 820px; margin: 0 auto;
  background: var(--surface-2);
  border-radius: var(--r-3);
  transition: background 120ms var(--ease), box-shadow 120ms var(--ease);
  overflow: hidden;
}
.composer:focus-within {
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--accent-ring);
}
.composer-input-wrap {
  position: relative;
  display: block;
}
.composer-ta {
  width: 100%;
  background: transparent;
  border: none; outline: none; resize: none;
  padding: 10px 36px 4px 12px;
  font-size: var(--fz-13);
  line-height: 1.55;
  color: var(--text);
  min-height: 38px; max-height: 160px;
}
.composer-ta::placeholder { color: var(--text-3); }

.composer-bar {
  display: flex; align-items: center;
  padding: 4px 6px 6px;
  gap: 4px;
  flex-wrap: wrap;
}
.composer-bar > * { flex-shrink: 0; }
.composer-bar .spacer { flex: 1 1 auto; min-width: 4px; }
.composer-opt {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px;
  border-radius: var(--r-2);
  font-size: var(--fz-11); font-weight: 500;
  color: var(--text-2);
  font-family: var(--font-mono);
}
.composer-opt:hover { background: var(--surface-3); color: var(--text); }
.composer-opt svg { width: 10px; height: 10px; color: var(--text-3); }
.composer-opt .cmp-model { color: var(--text); font-weight: 500; }
.composer-opt .cmp-think { display: inline-flex; align-items: flex-end; gap: 1px; padding-left: 4px; margin-left: 2px; border-left: 1px solid var(--border); }

/* Stacked-bars glyph for thinking effort */
.think-bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
.think-bars i {
  display: block; width: 2.5px; background: var(--text-3); opacity: 0.35; border-radius: 0.5px;
  transition: background 80ms, opacity 80ms;
}
.think-bars i:nth-child(1) { height: 4px; }
.think-bars i:nth-child(2) { height: 7px; }
.think-bars i:nth-child(3) { height: 10px; }
.think-bars i.on { background: var(--accent-text); opacity: 1; }

/* Model & thinking popover (rendered via portal at document.body) */
.popover.model-pop {
  position: fixed;
  width: 320px;
  padding: 4px;
  background: var(--surface);
  border-radius: var(--r-3);
  box-shadow: 0 0 0 1px var(--hairline), 0 12px 32px oklch(0 0 0 / 0.15);
  z-index: 100;
  animation: pop-in 100ms var(--ease);
}
@keyframes pop-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
.mp-section { padding: 6px 4px 4px; }
.mp-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 0 8px 6px;
}
.mp-section-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-2);
}
.mp-section-hint { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
.mp-list { display: flex; flex-direction: column; gap: 1px; }
.mp-row {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: 0; background: transparent;
  border-radius: var(--r-1);
  text-align: left; cursor: pointer;
  transition: background 60ms;
}
.mp-row:hover { background: var(--surface-3); }
.mp-row.active { background: var(--accent-soft); }
.mp-check {
  width: 12px; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 11px; color: var(--accent-text);
  text-align: center;
}
.mp-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mp-row-title { font-size: 12px; color: var(--text); font-weight: 500; }
.mp-row.active .mp-row-title { color: var(--accent-text); }
.mp-row-hint { font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono); }
.mp-think-grid {
  display: flex; gap: 4px;
  padding: 0 4px;
}
.mp-think {
  flex: 1 1 0;
  min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 2px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: var(--r-1);
  cursor: pointer;
  font-size: 10.5px; color: var(--text-2);
  transition: all 60ms;
}
.mp-think > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mp-think:hover { border-color: var(--text-3); color: var(--text); }
.mp-think.active {
  border-color: var(--accent-text);
  background: var(--accent-soft);
  color: var(--accent-text);
}
.composer-bar .spacer { flex: 1 1 auto; min-width: 4px; }
/* was `.composer-bar .spacer { flex: 1; }` */

/* Model picker — button styled like composer-opt, opens custom popover */
.cmp-model-anchor {
  position: relative;
  display: inline-flex;
}
.cmp-model-wrap {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  border: 0;
  background: transparent;
}
.cmp-model-wrap:hover { background: var(--surface-3); color: var(--text); }
.cmp-model-wrap:focus-visible { background: var(--surface-3); outline: 2px solid var(--accent-ring); outline-offset: 1px; }
.cmp-model {
  color: var(--text);
  font-weight: 500;
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  white-space: nowrap;
}
.cmp-caret {
  width: 10px;
  height: 10px;
  color: var(--text-3);
  flex-shrink: 0;
}
.cmp-think {
  display: inline-flex;
  align-items: flex-end;
  gap: 1px;
  padding-left: 4px;
  margin-left: 2px;
  border-left: 1px solid var(--border);
}
.think-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 1.5px;
  height: 10px;
}
.think-bars i {
  display: block;
  width: 2.5px;
  background: var(--text-3);
  opacity: 0.35;
  border-radius: 0.5px;
}
.think-bars i:nth-child(1) { height: 4px; }
.think-bars i:nth-child(2) { height: 7px; }
.think-bars i:nth-child(3) { height: 10px; }
.think-bars i.on { background: var(--accent-text); opacity: 1; }

/* Executor chip — colored dot + executor name */
.composer-ex {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px 3px 6px;
  border-radius: var(--r-2);
  background: var(--surface-3);
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--text-2);
  text-transform: lowercase;
}
.composer-ex .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.composer-ex .dot.codex { background: var(--codex); }
.composer-ex .dot.claude { background: var(--claude); }

/* Approval mode — segmented control */
.composer-mode {
  display: inline-flex;
  padding: 2px;
  border-radius: var(--r-2);
  background: var(--surface-3);
  gap: 1px;
  margin-right: 2px;
}
.cmode-item {
  padding: 3px 8px;
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.04em;
  white-space: nowrap;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.cmode-item:hover { color: var(--text); }
.cmode-item.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--hairline); }
.cmode-item.active[data-mode="auto"] { color: var(--accent-text); }
.cmode-item.active[data-mode="plan"] { color: var(--text); }
/* BYPASS — visually separated from PLAN/ASK/AUTO and always warn-tinted so
   users perceive it as a different category (skip approvals, dangerous). */
.cmode-item[data-mode="bypass"] {
  color: var(--warn);
  margin-left: 4px;
  position: relative;
}
.cmode-item[data-mode="bypass"]::before {
  content: "";
  position: absolute;
  left: -3px; top: 4px; bottom: 4px;
  width: 1px;
  background: var(--hairline);
}
.cmode-item[data-mode="bypass"]:hover { color: var(--warn); background: var(--warn-soft); }
.cmode-item.active[data-mode="bypass"] {
  color: var(--warn);
  background: var(--warn-soft);
  box-shadow: 0 0 0 1px var(--warn);
}
.composer.is-bypass-pending {
  box-shadow: 0 0 0 1px var(--warn), 0 0 0 3px var(--warn-soft);
}
.composer.is-bypass-pending:focus-within {
  box-shadow: 0 0 0 1px var(--warn), 0 0 0 3px var(--warn-soft);
}
.bypass-hint {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--warn);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-left: 6px;
  white-space: nowrap;
}

/* Plan-mode exit button (codex only — cc has the ExitPlanMode tool flow). */
.cmode-exit-plan {
  padding: 3px 10px;
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  color: var(--accent-text);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  cursor: pointer;
  margin-left: 4px;
}
.cmode-exit-plan:hover { background: var(--surface); }

/* Turns stepper (visible in auto mode) */
.turns-stepper {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 4px 2px 8px;
  background: var(--surface-2);
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
}
.turns-stepper .ts-lbl {
  color: var(--text-3);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 2px;
}
.turns-stepper .ts-val {
  min-width: 18px;
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.turns-stepper .ts-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px;
  background: transparent;
  border: 0;
  border-radius: 3px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 80ms;
}
.turns-stepper .ts-btn:hover { background: var(--surface-3); color: var(--text); }
.turns-stepper .ts-btn:disabled { opacity: 0.4; cursor: default; }

/* Unified composer action buttons (slash / mic / send / stop) — 28x28 square icons */
.composer-act {
  position: relative;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-1);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-3);
  cursor: pointer;
  transition: background 80ms, color 80ms, border-color 80ms;
  flex: none;
}
.composer-act:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.composer-act:disabled { opacity: 0.4; cursor: default; }
.composer-act svg { width: 14px; height: 14px; }
.composer-act-glyph {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
}
/* Slash button — framed [/] glyph (VS Code Claude Code style) */
.composer-act.slash-box .composer-slash-glyph {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border: 1px solid var(--hairline);
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  color: var(--text-2);
}
.composer-act.slash-box:hover:not(:disabled) .composer-slash-glyph {
  border-color: var(--border);
  color: var(--text);
}
.composer-act.slash-box.active .composer-slash-glyph {
  border-color: var(--accent-text);
  color: var(--accent-text);
}
.composer-act.primary {
  background: var(--accent);
  color: var(--accent-on);
  border-color: var(--accent);
}
.composer-act.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); color: var(--accent-on); }
.composer-act.primary:disabled { opacity: 0.5; }
.composer-act.primary.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
.composer-act.primary.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
.composer-act.recording {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}
.composer-act.transcribing {
  color: var(--accent-text);
}

/* Context strip below composer */
.ctx-bar {
  max-width: 820px; margin: 6px auto 0;
  display: flex; align-items: center; gap: 8px;
  height: 16px;
  padding: 0 4px;
}
.ctx-bar-empty { pointer-events: none; height: 0; margin: 0; }
.ctx-bar-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.ctx-bar-val {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
  white-space: nowrap;
  flex-shrink: 0;
}
.ctx-bar-val b { color: var(--text-2); font-weight: 600; }
.ctx-track {
  flex: 1;
  min-width: 80px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  overflow: hidden;
}
.ctx-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--accent);
  transition: width 300ms var(--ease), background 300ms var(--ease);
}
.ctx-fill.warn { background: var(--danger); }
.ctx-label {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
}
.ctx-label.warn { color: var(--danger); }

/* Active state for slash composer-act */
.composer-act.active {
  color: var(--accent-text);
  background: var(--accent-soft);
}

/* Slash command popover — portaled to body, positioned via inline style.
 * `position: fixed` so it floats above scrolling content; the React side
 * computes left/bottom/width from the composer's bounding rect. */
.cmp-slash-pop {
  position: fixed;
  background: var(--surface-2);
  border-radius: var(--r-2);
  box-shadow: 0 0 0 1px var(--hairline), 0 4px 16px oklch(0 0 0 / 0.15);
  overflow-y: auto;
  max-height: 60vh;
  z-index: 100;
  animation: slash-in 100ms var(--ease);
}
@keyframes slash-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.cmp-slash-row {
  display: flex; align-items: baseline; gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border: 0; background: transparent;
  text-align: left; cursor: pointer;
  transition: background 60ms;
}
.cmp-slash-row:hover,
.cmp-slash-row.active { background: var(--surface-3); }

.cmp-slash-cmd {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.cmp-slash-row.active .cmp-slash-cmd { color: var(--accent-text); }

.cmp-slash-desc {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Slash command source section headers */
.cmp-slash-section {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: 4px 10px 2px;
}
.cmp-slash-row[data-source="project"] .cmp-slash-cmd { color: var(--accent-text, var(--accent)); }
.cmp-slash-row[data-source="user"] .cmp-slash-cmd { color: var(--ok); }

.composer.is-locked {
  opacity: 0.55;
  pointer-events: none;
}
.composer.is-locked .composer-ta {
  cursor: not-allowed;
}
.composer-hint { display: none; }

/* ============================================================
   Job Mode progress bar
   ============================================================ */
.job-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 20px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
}
.job-progress-label {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--accent-text);
  white-space: nowrap;
}
.job-progress[data-done] .job-progress-label {
  color: var(--text-3);
}
.job-progress-track {
  flex: 1;
  height: 3px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}
.job-progress-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--accent);
  transition: width 400ms var(--ease), background 300ms var(--ease);
}
.job-progress-fill.done {
  background: var(--ok);
}
/* — ported from design/coding.css — job-progress pulse when active */
.job-progress:not([data-done]) .job-progress-label::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  margin-right: 5px;
  vertical-align: middle;
  animation: breath 1.6s ease-in-out infinite;
}
.job-progress-status {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
}

/* Main head extras for coding */
.session-titlebar { display: flex; align-items: center; gap: 10px; }
.main-head-ws {
  font-family: var(--font-mono);
  font-size: var(--fz-11);
  color: var(--text-3);
  white-space: nowrap;
}

/* ============================================================
   Preview panel — tabs + code
   ============================================================ */
.preview-tabs {
  display: flex; align-items: center; gap: 2px;
  padding: 6px 6px 0;
  overflow-x: auto;
}
.preview-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 8px 6px;
  border-radius: var(--r-2) var(--r-2) 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  position: relative;
  top: 1px;
}
.preview-tab:hover { color: var(--text); background: var(--surface-2); }
.preview-tab.active {
  color: var(--text);
  background: var(--surface-2);
  box-shadow: 0 0 0 1px var(--hairline);
}
.preview-tab-dot { width: 6px; height: 6px; border-radius: 50%; }
.preview-tab-dot.mod { background: var(--warn); }
.preview-tab-dot.add { background: var(--ok); }
.preview-tab-close {
  color: var(--text-3); font-size: 10px;
  width: 13px; height: 13px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-1);
}
.preview-tab-close:hover { background: var(--surface-3); color: var(--text); }

.preview-head {
  padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  position: relative;
}
.preview-head::after {
  content: "";
  position: absolute; left: 16px; right: 16px; bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline), transparent);
}
.preview-path {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
}
.preview-path .hi { color: var(--text); }
.preview-hunks {
  display: inline-flex; align-items: center; gap: 2px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3);
}
.preview-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 8px 0 16px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.7;
}

/* Hunk controls within preview */
.hunk-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
}
.hunk-bar .hunk-range { color: var(--text-2); }
.hunk-bar .spacer { flex: 1; }

.code-ln { display: grid; grid-template-columns: 40px 1fr; padding: 0 2px; }
.code-ln.add { background: oklch(from var(--ok) l c h / 0.07); }
.code-ln.add .code-num { color: var(--ok); }
.code-ln.del { background: oklch(from var(--danger) l c h / 0.07); }
.code-ln.del .code-num { color: var(--danger); }
.code-ln.hunk-head { background: var(--surface-2); color: var(--text-3); font-style: italic; }
.code-ln.file-head { background: var(--surface-2); color: var(--text-2); font-weight: 600; padding: 4px 12px; grid-template-columns: 1fr; }
.code-ln.file-head .code-num { display: none; }
.code-ln.file-head .code-txt { font-family: var(--font-mono); font-size: 11px; }
.code-num {
  text-align: right;
  padding-right: 10px;
  color: var(--text-3);
  user-select: none;
}
.code-txt { white-space: pre; color: var(--text); padding-right: 12px; }

/* ============================================================
   Files tab — Changed view, diff view, mode toggle
   ============================================================ */

.files-ws-picker {
  padding: 4px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.files-fchip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 6px;
  border-radius: var(--r-1, 4px);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  transition: background 80ms;
}
.files-fchip:hover { background: var(--surface-2); }
.files-fchip > .rfc-lbl {
  color: var(--text-3);
  font-size: 11px;
  flex-shrink: 0;
}
.files-fchip > select {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  background: transparent;
  font: inherit;
  color: var(--text);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
