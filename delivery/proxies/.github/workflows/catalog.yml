name: Publish Signed Catalog
on:
  workflow_dispatch:
    inputs:
      certification_run_id:
        description: Successful qualification run whose Proxy releases are public
        required: true
        type: string
      sequence:
        description: New monotonic Catalog sequence (first migration sequence is at least 7)
        required: true
        type: string
      issued_at:
        description: Explicit ISO-8601 issue time for reproducible metadata
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  sign-publish:
    if: github.repository == 'RichLogic/Gian-Proxies' && github.ref == 'refs/heads/main'
    environment: catalog-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-source.mjs
      - name: Validate and check documentation projection
        run: node --test catalog/proxy-information/project.test.mjs
      - name: Authenticate and download the qualification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<< "$RUN")" = success
          test "$(jq -r .path <<< "$RUN")" = .github/workflows/qualify.yml
          test "$(jq -r .event <<< "$RUN")" = workflow_dispatch
          test "$(jq -r .head_repository.full_name <<< "$RUN")" = "$GITHUB_REPOSITORY"
          SHA=$(jq -r .head_sha <<< "$RUN")
          ATTEMPT=$(jq -r .run_attempt <<< "$RUN")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "proxy-artifacts-$SHA-$ATTEMPT" --dir certification
      - name: Verify coordinates, sign and publish the Catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GIAN_CATALOG_SIGNING_KEY_PEM: ${{ secrets.GIAN_CATALOG_SIGNING_KEY_PEM }}
          CERTIFIED_SHA: ${{ steps.source.outputs.sha }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          CERTIFICATION_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SEQUENCE: ${{ inputs.sequence }}
          ISSUED_AT: ${{ inputs.issued_at }}
        run: node scripts/release-product.mjs catalog certification "$SEQUENCE" "$ISSUED_AT"
