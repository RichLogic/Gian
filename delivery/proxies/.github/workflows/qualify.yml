name: Qualify Proxy Artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'RichLogic/Gian-Proxies' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Qualify the independently buildable product
        env:
          GIAN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: pnpm qualify
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-artifacts-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
