name: Release Remote
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag, e.g. v1.0.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: remote-production
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'RichLogic/Gian-Remote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve immutable source tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release exists; use Deploy Remote to retry without rebuilding'; exit 1; fi
          git checkout --detach "$SHA"
          node scripts/verify-source.mjs
          test "v$(node -p "require('./release.json').version")" = "$RELEASE_TAG"
          node -e 'if(JSON.parse(require("fs").readFileSync(".gian-source.json")).workingTree)throw Error("Uncommitted export")'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  images:
    needs: qualify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate once
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ghcr.io/richlogic/gian-remote:build-${{ needs.qualify.outputs.sha }}-${{ matrix.arch }}
          build-args: |
            GIAN_REMOTE_BUILD_ID=${{ needs.qualify.outputs.sha }}
            GIAN_REMOTE_VERSION=${{ inputs.tag }}
      - name: Test actual candidate and publish identical image
        env:
          IMAGE: ghcr.io/richlogic/gian-remote:build-${{ needs.qualify.outputs.sha }}-${{ matrix.arch }}
          REVISION: ${{ needs.qualify.outputs.sha }}
        run: |
          bash scripts/smoke-image.sh "$IMAGE" "$REVISION"
          docker push "$IMAGE"
          mkdir digests
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > digests/${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/
  publish:
    needs: [qualify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - name: Publish stable manifest and receipt
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/richlogic/gian-remote:$RELEASE_TAG"
          docker buildx imagetools create -t "$IMAGE" "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          export IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          node scripts/release-metadata.mjs create remote-release.json
          sha256sum remote-release.json > SHA256SUMS
          gh release create "$RELEASE_TAG" remote-release.json SHA256SUMS --verify-tag --title "Gian Remote $RELEASE_TAG" --notes "Remote Server and Web. Deployment uses the immutable image digest in remote-release.json."
  deploy:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
