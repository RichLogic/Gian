name: Deploy Remote
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release to deploy again (no rebuild)
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  packages: read
concurrency:
  group: remote-deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'RichLogic/Gian-Remote' && vars.REMOTE_DEPLOY_ENABLED == 'true' && (github.event_name != 'release' || github.event.release.prerelease == false) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: remote-production
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify published release and resolve exact source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > release-status.json
          jq -e --arg tag "$RELEASE_TAG" '.isDraft == false and .isPrerelease == false and .tagName == $tag' release-status.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          mkdir receipt
          gh release download "$RELEASE_TAG" --pattern remote-release.json --pattern SHA256SUMS --dir receipt
          (cd receipt && sha256sum --check SHA256SUMS)
          export RELEASE_SHA
          node scripts/release-metadata.mjs verify receipt/remote-release.json
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          # Transport fixes on main can retry immutable releases without rebuilding.
          # Upload mode still sends only the release's Compose and host script.
          git restore --source "$RELEASE_SHA" -- compose.yaml scripts/deploy.sh
      - name: Deploy verified image over pinned SSH connection
        env:
          REMOTE_SSH_HOST: ${{ vars.REMOTE_SSH_HOST }}
          REMOTE_SSH_USER: ${{ vars.REMOTE_SSH_USER }}
          REMOTE_SSH_PORT: ${{ vars.REMOTE_SSH_PORT || '22' }}
          REMOTE_DEPLOY_DIR: ${{ vars.REMOTE_DEPLOY_DIR }}
          REMOTE_SSH_MODE: ${{ vars.REMOTE_SSH_MODE || 'upload' }}
          REMOTE_REGISTRY_USER: ${{ github.actor }}
          REMOTE_REGISTRY_TOKEN: ${{ github.token }}
          REMOTE_SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
          REMOTE_SSH_KNOWN_HOSTS: ${{ secrets.REMOTE_SSH_KNOWN_HOSTS }}
        run: node scripts/deploy-ssh.mjs receipt/remote-release.json
