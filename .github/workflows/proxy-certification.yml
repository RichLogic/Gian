name: Proxy Release Certification

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Preview comparison base; leave empty to use the parent commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: proxy-release-certification
  cancel-in-progress: false

jobs:
  release-certificate:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require candidate commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Require GitHub-hosted macOS ARM64
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          test "${RUNNER_KIND}" = github-hosted
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install chromium

      - name: Prepare exact managed Runtime candidates
        run: node scripts/build-managed-runtime-candidates.mjs --output artifacts/runtimes

      - name: Issue pre-Catalog artifact certificate
        shell: bash
        env:
          GIAN_ALLOW_ELECTRON_PREVIEW: '1'
          GIAN_ALLOW_PACKAGE: '1'
          GIAN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          BASE_REF="${{ inputs.base_ref }}"
          if [ -z "${BASE_REF}" ]; then BASE_REF="${GITHUB_SHA}^"; fi
          pnpm verify:proxy -- \
            --stage artifacts \
            --base "${BASE_REF}" \
            --output output/proxy-certification/release

      - name: Upload certificate, evidence, and exact qualified artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-release-certification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/proxy-certification/release
            artifacts/proxies
            artifacts/runtimes
