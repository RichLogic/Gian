name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '41 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Node 24 source gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and base history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify traceability
        run: pnpm quality:traceability

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:all

      - name: Build
        run: pnpm build

  e2e:
    name: Isolated browser E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated E2E
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            output/playwright/
