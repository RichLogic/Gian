name: Remote source and distribution
on:
  push:
    branches: ['release/[0-9]+.[0-9]+.[0-9]+']
    paths: ['packages/remote-*/**', 'packages/shared/**', 'packages/chat-ui/**', 'delivery/remote/**', 'scripts/export-remote*', 'scripts/remote-delivery*', 'scripts/remote-deployment*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/remote.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require version branch
        shell: bash
        run: '[[ "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/remote-delivery.test.mjs scripts/remote-deployment-system.test.mjs scripts/remote-protocol-package.test.mjs
      - run: node scripts/export-remote.mjs --ref HEAD --output "$RUNNER_TEMP/remote-source"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Verify clean independent checkout
        working-directory: ${{ runner.temp }}/remote-source
        run: |
          node scripts/verify-source.mjs
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/remote-source
          load: true
          tags: gian-remote:source-ci
          build-args: |
            GIAN_REMOTE_BUILD_ID=${{ github.sha }}
            GIAN_REMOTE_VERSION=source-ci
      - working-directory: ${{ runner.temp }}/remote-source
        run: bash scripts/smoke-image.sh gian-remote:source-ci "$GITHUB_SHA"
