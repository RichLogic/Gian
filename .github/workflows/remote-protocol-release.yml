name: Release Remote Protocol Package
on:
  push:
    tags: ['remote-protocol-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing remote-protocol-vX.Y.Z tag on public Gian main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: remote-protocol-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'RichLogic/Gian' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate immutable protocol source
        id: source
        env:
          PROTOCOL_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PROTOCOL_TAG" =~ ^remote-protocol-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse --verify "refs/tags/$PROTOCOL_TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          if gh release view "$PROTOCOL_TAG" >/dev/null 2>&1; then echo 'Protocol package already published; never replace its bytes'; exit 1; fi
          git checkout --detach "$SHA"
          test "remote-protocol-v$(node -p "require('./packages/remote-protocol/package.json').version")" = "$PROTOCOL_TAG"
          node scripts/delivery-certificate.mjs verify-public-source
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$PROTOCOL_TAG" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install locked protocol dependencies
        run: pnpm --filter @gian/remote-protocol... install --frozen-lockfile
      - name: Check and pack the protocol package
        run: |
          pnpm --filter @gian/remote-protocol test
          node scripts/remote-protocol-package.mjs pack "$RUNNER_TEMP/protocol-package"
      - name: Verify an isolated archive consumer
        run: |
          mkdir "$RUNNER_TEMP/protocol-consumer"
          cd "$RUNNER_TEMP/protocol-consumer"
          node -e 'require("fs").writeFileSync("package.json",JSON.stringify({name:"remote-protocol-consumer",private:true,type:"module"}))'
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/protocol-package/*.tgz
          node --input-type=module -e 'import {createRemoteHello,REMOTE_PROTOCOL} from "@gian/remote-protocol"; if(REMOTE_PROTOCOL!=="gian.remote/1"||createRemoteHello("11111111-1111-4111-8111-111111111111","consumer").type!=="hello")throw Error("Invalid protocol package")'
          node -e 'require("fs").writeFileSync("consumer.mts", "import {createRemoteHello,type Hello} from \"@gian/remote-protocol\"; const h: Hello = createRemoteHello(\"11111111-1111-4111-8111-111111111111\", \"consumer\"); console.log(h.type);\n")'
          "$GITHUB_WORKSPACE/packages/remote-protocol/node_modules/.bin/tsc" --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM --skipLibCheck --typeRoots "$GITHUB_WORKSPACE/packages/remote-protocol/node_modules/@types" consumer.mts
      - uses: actions/upload-artifact@v4
        with:
          name: remote-protocol-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/protocol-package/*.tgz
            ${{ runner.temp }}/protocol-package/protocol-package.json
            ${{ runner.temp }}/protocol-package/SHA256SUMS
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: remote-protocol-${{ needs.package.outputs.sha }}
          path: artifact
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish tested bytes outside the desktop latest channel
        env:
          PROTOCOL_TAG: ${{ needs.package.outputs.tag }}
          PROTOCOL_SHA: ${{ needs.package.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifact && sha256sum --check SHA256SUMS)
          node --input-type=module -e 'import fs from "node:fs"; import {verifyProtocolArchive} from "./delivery/remote/scripts/protocol-dependency.mjs"; const c=JSON.parse(fs.readFileSync("artifact/protocol-package.json")); if(c.tag!==process.env.PROTOCOL_TAG||c.sourceCommit!==process.env.PROTOCOL_SHA)throw Error("Protocol release source mismatch"); verifyProtocolArchive(c,fs.readFileSync(`artifact/${c.filename}`));'
          gh release create "$PROTOCOL_TAG" artifact/*.tgz artifact/protocol-package.json artifact/SHA256SUMS --verify-tag --latest=false --title "Remote Protocol $PROTOCOL_TAG" --notes-file packages/remote-protocol/CHANGELOG.md
