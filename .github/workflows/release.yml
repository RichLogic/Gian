name: Release Gian

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release tag
        run: node scripts/check-version-consistency.mjs --release-ref "${GITHUB_REF_NAME}"

      - name: Verify beta release configuration
        env:
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}
        run: |
          test -n "${GIAN_GITHUB_CLIENT_ID}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run quality:audit:prod

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test

      - name: Build unsigned Gian beta
        run: pnpm --filter @gian/desktop make:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}

      - name: Verify unsigned beta artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/MacOS/Gian
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/Resources/runtime/node
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.dmg"
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.zip"

      - name: Create desktop checksums
        working-directory: packages/desktop/release
        run: shasum -a 256 Gian-*.dmg Gian-*.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/desktop/release/Gian-*.dmg \
            packages/desktop/release/Gian-*.zip \
            packages/desktop/release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --notes "Unsigned self-use beta. This build is not signed or notarized; see README for macOS Gatekeeper instructions." \
            --prerelease \
            --title "Gian ${GITHUB_REF_NAME} (unsigned beta)"
