name: Release Gian

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          for MANIFEST in \
            packages/desktop/package.json \
            packages/host/package.json \
            packages/shared/package.json \
            packages/web/package.json \
            packages/proxies/cc-proxy/package.json \
            packages/proxies/codex-proxy/package.json \
            packages/proxies/kimi-proxy/package.json
          do
            test "$(node -p "require('./${MANIFEST}').version")" = "${VERSION}"
          done

      - name: Verify beta release configuration
        env:
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}
        run: |
          test -n "${GIAN_GITHUB_CLIENT_ID}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test

      - name: Build proxy release assets
        run: pnpm release:proxies

      - name: Build unsigned Gian beta
        run: pnpm --filter @gian/desktop make:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}

      - name: Verify unsigned beta artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/MacOS/Gian
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/Resources/runtime/node
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.dmg"
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.zip"

      - name: Create desktop checksums
        working-directory: packages/desktop/release
        run: shasum -a 256 Gian-*.dmg Gian-*.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/desktop/release/Gian-*.dmg \
            packages/desktop/release/Gian-*.zip \
            packages/desktop/release/SHA256SUMS \
            artifacts/proxies/* \
            --verify-tag \
            --generate-notes \
            --notes "Unsigned self-use beta. This build is not signed or notarized; see README for macOS Gatekeeper instructions." \
            --prerelease \
            --title "Gian ${GITHUB_REF_NAME} (unsigned beta)"
