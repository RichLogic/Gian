name: Release Gian

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release tag
        run: node scripts/check-version-consistency.mjs --release-ref "${GITHUB_REF_NAME}"

      - name: Verify signed stable release configuration
        env:
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "${GIAN_GITHUB_CLIENT_ID}"
          test -n "${CSC_LINK}"
          test -n "${CSC_KEY_PASSWORD}"
          test -n "${APPLE_API_KEY_BASE64}"
          test -n "${APPLE_API_KEY_ID}"
          test -n "${APPLE_API_ISSUER}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run quality:audit:prod

      - name: Verify source
        run: |
          pnpm quality:traceability
          pnpm typecheck
          pnpm test:all

      - name: Verify the packaged product path
        run: pnpm quality:package
        env:
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gian-notary"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 -D > "${RUNNER_TEMP}/gian-notary/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/gian-notary/AuthKey.p8"

      - name: Build signed and notarized Gian
        run: pnpm --filter @gian/desktop make:mac:release
        env:
          GIAN_GITHUB_CLIENT_ID: ${{ vars.GIAN_GITHUB_CLIENT_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/gian-notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signed, notarized stable artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/MacOS/Gian
          test -x packages/desktop/release/mac-arm64/Gian.app/Contents/Resources/runtime/node
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.dmg"
          test -f "packages/desktop/release/Gian-${VERSION}-arm64.zip"
          codesign --verify --deep --strict --verbose=2 packages/desktop/release/mac-arm64/Gian.app
          xcrun stapler validate packages/desktop/release/mac-arm64/Gian.app
          spctl --assess --type execute --verbose=2 packages/desktop/release/mac-arm64/Gian.app

      - name: Create desktop checksums
        working-directory: packages/desktop/release
        run: shasum -a 256 Gian-*.dmg Gian-*.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/desktop/release/Gian-*.dmg \
            packages/desktop/release/Gian-*.zip \
            packages/desktop/release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --notes "Signed and notarized stable macOS Apple Silicon release." \
            --latest \
            --title "Gian ${GITHUB_REF_NAME}"
